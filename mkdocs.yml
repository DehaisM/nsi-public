site_name: SNT/NSI - Lycée Jean Prévost
site_url: https://nsi.mdehais.fr/
site_description: "Cours, TP et exercices de SNT et de NSI de Mathias Déhais, lycée Jean Prévost de Montivilliers."
site_author: Mathias Déhais
docs_dir: docs-public

theme:
  name: material
  language: fr
  font: false
  logo: assets/logo3.png
  favicon: assets/logo3.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - styles/fonts.css
  - styles/site.css

extra:
  generator: false

validation:
  nav:
    omitted_files: ignore
not_in_nav: |
  /archives/**
  /echecs/**

nav:

  - Accueil: index.md

  - Seconde GT:
      - SNT/index.md
      - Introduction: SNT/introduction/index.md
      - Thématique 1 - Internet: SNT/internet/index.md
      - Thématique 2 - Données structurées: SNT/donnees/index.md

  - Première NSI:
      - 1NSI/index.md
      - Introduction: 1NSI/introduction/index.md
      - Thématique 0 - Bases de Python: 1NSI/python/index.md
      - Thématique 1 - Types construits: 1NSI/types-construits/index.md

  - Terminale NSI: TNSI/index.md

  - Entraînement: entrainement/index.md

  - Années précédentes:
      - archives/index.md
      - 2025-2026: archives/2025-2026/index.md

plugins:
  - search
  - redirects:
      # Pages déplacées : leur ancienne adresse reste valable (moteurs de recherche, favoris)
      redirect_maps:
        1NSI/algo/index.md: archives/2025-2026/1NSI/algo/index.md
        1NSI/donnees/index.md: archives/2025-2026/1NSI/donnees/index.md
        1NSI/os/index.md: archives/2025-2026/1NSI/os/index.md
        1NSI/pratique/index.md: archives/2025-2026/1NSI/pratique/index.md
        1NSI/projet/index.md: archives/2025-2026/1NSI/projet/index.md
        1NSI/table/index.md: archives/2025-2026/1NSI/table/index.md
        SNT/python/index.md: archives/2025-2026/SNT/python/index.md
        SNT/reseaux/index.md: archives/2025-2026/SNT/reseaux/index.md
        SNT/web/index.md: archives/2025-2026/SNT/web/index.md
        TNSI/architecture/index.md: archives/2025-2026/TNSI/architecture/index.md
        TNSI/bdd/index.md: archives/2025-2026/TNSI/bdd/index.md
        TNSI/donnees/index.md: archives/2025-2026/TNSI/donnees/index.md
        TNSI/projet/index.md: archives/2025-2026/TNSI/projet/index.md
        TNSI/python/index.md: archives/2025-2026/TNSI/python/index.md
        TNSI/tp/index.md: archives/2025-2026/TNSI/tp/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
