site_name: SNT/NSI - Lycée Jean Prévost
site_url: https://nsi.mdehais.fr/
docs_dir: docs-public

theme:
  name: material
  language: fr
  logo: assets/logo3.png
  favicon: assets/logo3.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;0,700;1,500&display=swap
  - styles/site.css

validation:
  nav:
    omitted_files: ignore
not_in_nav: |
  /archives/**
  /echecs/**

nav:

  - Accueil: index.md

  - Seconde GT:
      - SNT/index.md
      - Introduction: SNT/introduction/index.md

  - Première NSI: 1NSI/index.md

  - Terminale NSI: TNSI/index.md

  - Années précédentes:
      - archives/index.md
      - 2025-2026: archives/2025-2026/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
