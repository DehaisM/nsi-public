# Banque d'exercices de la page Entrainement.
#
# Champs communs :
#   id         identifiant unique, minuscules et tirets (sert dans l'adresse de la page)
#   numero     entier unique qui sert au code de sauvegarde des eleves : prendre le prochain
#              numero libre, ne jamais changer ni reutiliser celui d'un exercice existant
#   titre      titre court
#   notion     une des notions listees ci-dessous
#   niveaux    liste : seconde et/ou premiere
#   difficulte 1, 2 ou 3
#   duree      duree indicative en minutes
#   type       code : l'eleve ecrit du code, verifie par des tests
#              prediction : l'eleve predit ce qu'affiche un code
#
# Pour le type code :
#   enonce, depart (code de depart), aides (3 niveaux), solution, tests
#   interdit (facultatif) : noms interdits, plus "[:]" pour les tranches et "in" pour le test d'appartenance
#   Un test est l'un de ces trois genres (ajouter cache: true pour ne pas montrer le cas a l'eleve) :
#     - appel: compter([1, 2], 1)     attendu: "1"
#     - variable: total               attendu: "27"
#     - sortie: "Bonjour"
#
# Pour le type prediction :
#   enonce, code, choix (liste de textes), explication
#   La bonne reponse est toujours le PREMIER choix : la page melange ensuite les choix,
#   et le verificateur controle que c'est bien ce que le code affiche.
#
# Apres chaque modification, lancer : python outils/verifier_exercices.py

notions:
  - { id: variables, nom: "Variables" }
  - { id: conditions, nom: "Conditions" }
  - { id: for, nom: "Boucles for" }
  - { id: while, nom: "Boucles while" }
  - { id: fonctions, nom: "Fonctions" }
  - { id: listes, nom: "Listes" }
  - { id: grilles, nom: "Grilles" }

exercices:

  - id: solde-cantine
    numero: 1
    titre: Le solde de la cantine
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Une carte de cantine contient `solde` euros, et un repas coûte `repas` euros.

      Créer une variable `reste` qui contient le solde après **deux** repas, en utilisant les variables `solde` et `repas`. Puis afficher `reste`.
    depart: |
      solde = 20
      repas = 3.5

    aides:
      - |
        # calculer ce que coutent deux repas
        # le retirer du solde et le ranger dans une variable reste
        # afficher reste
      - |
        reste = solde - ___
        print(___)
      - |
        reste = solde - 2 * repas
        print(___)
    solution: |
      solde = 20
      repas = 3.5
      reste = solde - 2 * repas
      print(reste)
    tests:
      - { variable: reste, attendu: "13.0" }
      - { sortie: "13.0" }

