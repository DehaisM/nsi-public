  - id: temperature-bug
    numero: 12
    titre: Le thermomètre en hiver
    notion: listes
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    type: code
    enonce: |
      Cette fonction doit renvoyer la température la plus haute d'une liste non vide, sans utiliser `max`. Elle semble fonctionner, mais `plus_chaud([-5, -2, -9])` renvoie `0` au lieu de `-2`. Trouver l'erreur et la corriger.
    depart: |
      def plus_chaud(temperatures):
          maxi = 0
          for t in temperatures:
              if t > maxi:
                  maxi = t
          return maxi
    aides:
      - |
        # suivre le code a la main avec [-5, -2, -9]
        # que se passe-t-il au premier tour de boucle ?
        # par quelle valeur faudrait-il commencer ?
      - |
        def plus_chaud(temperatures):
            maxi = temperatures[___]
            for t in temperatures:
                if t > maxi:
                    maxi = t
            return maxi
      - |
        def plus_chaud(temperatures):
            maxi = temperatures[0]
            for t in temperatures:
                if t > maxi:
                    maxi = ___
            return maxi
    solution: |
      def plus_chaud(temperatures):
          maxi = temperatures[0]
          for t in temperatures:
              if t > maxi:
                  maxi = t
          return maxi
    interdit: [max, sort, sorted]
    tests:
