  - id: mot-de-passe
    numero: 49
    titre: Le mot de passe solide
    notion: fonctions
    niveaux: [premiere]
    difficulte: 3
    duree: 6
    type: code
    enonce: |
      Écrire deux fonctions :

      `contient_chiffre(texte)` renvoie `True` si `texte` contient au moins un chiffre ;

      `est_solide(mdp)` **utilise** `contient_chiffre` et renvoie `True` si `mdp` contient au moins 8 caractères et au moins un chiffre.
    depart: |
      def contient_chiffre(texte):
          ...

      def est_solide(mdp):
          ...
    aides:
      - |
        def contient_chiffre(texte):
            # parcourir les caracteres de texte
            #     si le caractere est dans "0123456789", renvoyer True
            # apres la boucle, renvoyer False

        def est_solide(mdp):
            # renvoyer True si la longueur est suffisante et si contient_chiffre le confirme
      - |
        def contient_chiffre(texte):
            for caractere in texte:
                if caractere in ___:
                    return ___
            return ___

        def est_solide(mdp):
            return len(mdp) >= ___ and contient_chiffre(___)
      - |
        def contient_chiffre(texte):
            for caractere in texte:
                if caractere in "0123456789":
                    return True
            return False

        def est_solide(mdp):
            return len(mdp) >= 8 and ___
    solution: |
      def contient_chiffre(texte):
          for caractere in texte:
              if caractere in "0123456789":
                  return True
          return False

      def est_solide(mdp):
          return len(mdp) >= 8 and contient_chiffre(mdp)
    autres_solutions:
      - |
        def contient_chiffre(texte):
            i = 0
            while i < len(texte):
                if texte[i] in "0123456789":
                    return True
                i = i + 1
            return False

        def est_solide(mdp):
            if len(mdp) < 8:
                return False
            if contient_chiffre(mdp):
                return True
            return False
    tests:
      - { appel: "contient_chiffre('abc4')", attendu: "True" }
      - { appel: "contient_chiffre('abcd')", attendu: "False" }
      - { appel: "est_solide('python2026')", attendu: "True" }
      - { appel: "est_solide('python')", attendu: "False", libelle: "est_solide('python') : trop court, sans chiffre" }
      - { appel: "est_solide('abc1')", attendu: "False", libelle: "est_solide('abc1') : un chiffre, mais trop court" }
      - { appel: "est_solide('motdepasse')", attendu: "False", libelle: "est_solide('motdepasse') : assez long, sans chiffre" }
