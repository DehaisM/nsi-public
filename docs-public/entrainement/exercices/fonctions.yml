  - id: remise-boutique
    numero: 44
    titre: Le prix soldé
    notion: fonctions
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `prix_solde(prix, remise)` qui renvoie le prix après une remise de `remise` pour cent. Par exemple, `prix_solde(50, 20)` renvoie 40.0.
    depart: |
      def prix_solde(prix, remise):
          ...
    aides:
      - |
        def prix_solde(prix, remise):
            # calculer le montant de la remise : prix fois remise divise par 100
            # le retirer du prix et renvoyer le resultat
      - |
        def prix_solde(prix, remise):
            montant = prix * ___ / 100
            return prix - ___
      - |
        def prix_solde(prix, remise):
            montant = prix * remise / 100
            return ___
    solution: |
      def prix_solde(prix, remise):
          montant = prix * remise / 100
          return prix - montant
    autres_solutions:
      - |
        def prix_solde(prix, remise):
            return prix * (1 - remise / 100)
    tests:
      - { appel: "prix_solde(50, 20)", attendu: "40.0" }
