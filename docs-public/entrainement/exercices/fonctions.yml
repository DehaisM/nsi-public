        # a quel moment peut-on etre sur qu'il n'y a aucune voyelle ?
      - |
        def a_une_voyelle(mot):
            for lettre in mot:
                if lettre in "aeiouy":
                    return ___
            return ___
      - |
        def a_une_voyelle(mot):
            for lettre in mot:
                if lettre in "aeiouy":
                    return True
            return ___
    solution: |
      def a_une_voyelle(mot):
          for lettre in mot:
              if lettre in "aeiouy":
                  return True
          return False
    tests:
