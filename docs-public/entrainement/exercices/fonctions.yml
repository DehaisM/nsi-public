      def chiffre_double(c):
          d = c * 2
          if d > 9:
              return d - 9
          return d

      def est_valide(numero):
          total = 0
          for position in range(len(numero)):
              chiffre = int(numero[len(numero) - 1 - position])
              if position % 2 == 1:
                  chiffre = chiffre_double(chiffre)
              total = total + chiffre
          return total % 10 == 0
