  - id: celsius-fahrenheit
    numero: 45
    titre: Celsius et Fahrenheit
    notion: fonctions
    niveaux: [premiere]
    difficulte: 1
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Pour convertir des degrés Celsius en degrés Fahrenheit, on multiplie par 9, on divise par 5, puis on ajoute 32.

      Compléter la fonction `en_fahrenheit(c)`, puis la fonction `gel(c)`, qui **utilise** `en_fahrenheit` pour renvoyer `True` si la température en Fahrenheit est inférieure ou égale à 32.
    depart: |
      def en_fahrenheit(c):
          return ___

      def gel(c):
          f = ___
          return ___
    aides:
      - |
        # en_fahrenheit traduit la formule de l'enonce
        # gel appelle en_fahrenheit, puis compare le resultat a 32
      - |
        def en_fahrenheit(c):
            return c * 9 / 5 + ___

        def gel(c):
            f = en_fahrenheit(___)
            return f <= ___
      - |
        def en_fahrenheit(c):
            return c * 9 / 5 + 32

        def gel(c):
            f = en_fahrenheit(c)
            return ___
    solution: |
      def en_fahrenheit(c):
          return c * 9 / 5 + 32

      def gel(c):
          f = en_fahrenheit(c)
          return f <= 32
    tests:
      - { appel: "en_fahrenheit(0)", attendu: "32.0" }
      - { appel: "en_fahrenheit(100)", attendu: "212.0" }
      - { appel: "gel(-5)", attendu: "True" }
      - { appel: "gel(20)", attendu: "False" }
      - { appel: "gel(0)", attendu: "True", cache: true }
      - { appel: "en_fahrenheit(-40)", attendu: "-40.0", cache: true }
      - { appel: "gel(0.4)", attendu: "False", cache: true }

