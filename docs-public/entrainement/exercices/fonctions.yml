    depart: |
      def est_bissextile(annee):
          return (annee % 4 == 0 and annee % 100 != 0) or annee % 400 == 0

      def nb_jours(mois, annee):
          ...

      def date_valide(jour, mois, annee):
          ...
    aides:
      - |
        def est_bissextile(annee):
            return (annee % 4 == 0 and annee % 100 != 0) or annee % 400 == 0

        def nb_jours(mois, annee):
            # traiter fevrier avec est_bissextile
            # puis les mois de 30 jours
            # sinon, renvoyer 31

