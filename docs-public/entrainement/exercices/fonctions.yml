  - id: distance-points
    numero: 47
    titre: La distance entre deux points
    notion: fonctions
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      La distance entre les points de coordonnées `(xa, ya)` et `(xb, yb)` est la racine carrée de `(xb - xa)² + (yb - ya)²`.

      Écrire une fonction `distance(xa, ya, xb, yb)` qui la renvoie. La ligne `import math` est déjà écrite : `math.sqrt(x)` donne la racine carrée de `x`.
    depart: |
      import math

      def distance(xa, ya, xb, yb):
          ...
    aides:
      - |
        import math

        def distance(xa, ya, xb, yb):
            # calculer l'ecart horizontal et l'ecart vertical
            # calculer la somme de leurs carres
            # renvoyer la racine carree de cette somme
      - |
        import math

        def distance(xa, ya, xb, yb):
            somme = (xb - xa) ** 2 + (___) ** 2
            return math.sqrt(___)
      - |
        import math

        def distance(xa, ya, xb, yb):
            somme = (xb - xa) ** 2 + (yb - ya) ** 2
            return ___
    solution: |
      import math

      def distance(xa, ya, xb, yb):
          somme = (xb - xa) ** 2 + (yb - ya) ** 2
          return math.sqrt(somme)
    tests:
      - { appel: "distance(0, 0, 3, 4)", attendu: "5.0" }
      - { appel: "distance(1, 1, 1, 1)", attendu: "0.0", libelle: "distance(1, 1, 1, 1) : le même point" }
      - { appel: "distance(-1, 2, 2, -2)", attendu: "5.0" }
      - { appel: "distance(0, 0, 1, 1)", attendu: "1.4142135623730951", cache: true }

