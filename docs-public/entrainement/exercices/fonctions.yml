    enonce: |
      Dans un championnat, une victoire rapporte 3 points, un match nul 1 point et une défaite 0 point.

      Écrire une fonction `points(pour, contre)` qui renvoie les points gagnés selon les buts marqués et encaissés, puis une fonction `total(p1, c1, p2, c2)` qui **utilise** `points` et renvoie le total de points sur deux matchs.
