    type: code
    enonce: |
      La fonction `est_bissextile(annee)` est déjà écrite. L'utiliser pour écrire :

      `nb_jours(mois, annee)`, qui renvoie le nombre de jours du mois (de 1 à 12) : 30 pour les mois 4, 6, 9 et 11, 29 ou 28 pour février selon l'année, et 31 sinon ;

