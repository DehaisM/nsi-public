  - id: rendre-la-monnaie
    numero: 8
    titre: Rendre la monnaie
    notion: fonctions
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Écrire une fonction `monnaie(prix, paye)` qui renvoie la somme à rendre, ou `0` si la personne n'a pas assez payé.
    depart: |
      def monnaie(prix, paye):
          ...
    aides:
      - |
        def monnaie(prix, paye):
            # si paye est superieur ou egal a prix, renvoyer la difference
            # sinon, renvoyer 0
      - |
        def monnaie(prix, paye):
            if paye >= ___:
                return ___
            return ___
      - |
        def monnaie(prix, paye):
            if paye >= prix:
                return paye - prix
            return ___
    solution: |
      def monnaie(prix, paye):
          if paye >= prix:
              return paye - prix
          return 0
    tests:
      - { appel: "monnaie(3, 5)", attendu: "2" }
      - { appel: "monnaie(5, 5)", attendu: "0" }
      - { appel: "monnaie(5, 2)", attendu: "0", libelle: "monnaie(5, 2) : pas assez payé" }
      - { appel: "monnaie(1, 10)", attendu: "9", cache: true }

