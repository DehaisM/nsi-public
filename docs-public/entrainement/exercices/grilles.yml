    solution: |
      def somme_de(ligne):
          total = 0
          for valeur in ligne:
              total = total + valeur
          return total

      def lignes_egales(grille):
          reference = somme_de(grille[0])
          for ligne in grille:
              if somme_de(ligne) != reference:
                  return False
          return True
    tests:
