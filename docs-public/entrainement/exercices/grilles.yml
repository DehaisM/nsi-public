      - { appel: "transposee([[1, 2], [3, 4]])", attendu: "[[1, 3], [2, 4]]" }
      - { appel: "transposee([[1], [2]])", attendu: "[[1, 2]]", cache: true }
      - appel: "(lambda g: (transposee(g), g)[1])([[1, 2]])"
        attendu: "[[1, 2]]"
        libelle: "La grille de départ n'est pas modifiée"
