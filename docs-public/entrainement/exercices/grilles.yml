        def transposee(grille):
            # creer une grille vide
            # pour chaque indice de colonne j :
            #     creer une nouvelle ligne
            #     parcourir les lignes de la grille et ajouter l'element d'indice j
            #     ajouter la nouvelle ligne a la grille resultat
            # renvoyer le resultat
      - |
        def transposee(grille):
            resultat = []
            for j in range(len(grille[___])):
                nouvelle = []
                for ligne in grille:
                    nouvelle.append(ligne[___])
                resultat.append(___)
            return resultat
      - |
        def transposee(grille):
            resultat = []
            for j in range(len(grille[0])):
                nouvelle = []
                for ligne in grille:
                    nouvelle.append(ligne[j])
                resultat.append(___)
            return resultat
    solution: |
      def transposee(grille):
          resultat = []
          for j in range(len(grille[0])):
              nouvelle = []
              for ligne in grille:
                  nouvelle.append(ligne[j])
              resultat.append(nouvelle)
          return resultat
    tests:
