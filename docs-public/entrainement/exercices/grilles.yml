      def est_magique(grille):
          n = len(grille)
          reference = 0
          for j in range(n):
              reference = reference + grille[0][j]
          for i in range(n):
              ligne = 0
              colonne = 0
              for j in range(n):
                  ligne = ligne + grille[i][j]
                  colonne = colonne + grille[j][i]
              if ligne != reference or colonne != reference:
                  return False
          diagonale1 = 0
          diagonale2 = 0
          for i in range(n):
              diagonale1 = diagonale1 + grille[i][i]
              diagonale2 = diagonale2 + grille[i][n - 1 - i]
          return diagonale1 == reference and diagonale2 == reference
