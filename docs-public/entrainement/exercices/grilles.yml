        def somme_de(ligne):
            total = 0
            for valeur in ligne:
                total = ___
            return total

        def lignes_egales(grille):
            reference = somme_de(grille[___])
            for ligne in grille:
                if somme_de(___) != reference:
                    return ___
            return ___
      - |
        def somme_de(ligne):
            total = 0
