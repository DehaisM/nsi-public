    enonce: |
      Écrire une fonction `transposee(grille)` qui renvoie une nouvelle grille dont les lignes sont les colonnes de `grille`. Par exemple, `transposee([[1, 2, 3], [4, 5, 6]])` renvoie `[[1, 4], [2, 5], [3, 6]]`. La grille de départ n'est pas vide, et elle ne doit pas être modifiée.
    depart: |
