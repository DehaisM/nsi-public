    notion: for
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Écrire une fonction `compter_voyelles(mot)` qui renvoie le nombre de voyelles (`a`, `e`, `i`, `o`, `u`, `y`) de `mot`, écrit en minuscules et sans accent.
    depart: |
      def compter_voyelles(mot):
          ...
    aides:
      - |
        def compter_voyelles(mot):
            # creer un compteur qui vaut 0
            # parcourir chaque lettre de mot
            #     si la lettre fait partie de "aeiouy", ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def compter_voyelles(mot):
            compteur = ___
            for lettre in ___:
                if lettre in "aeiouy":
                    compteur = ___
            return ___
