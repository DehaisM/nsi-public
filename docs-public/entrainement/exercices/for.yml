  - id: sapin-etoiles
    numero: 89
    titre: Le sapin
    notion: for
    niveaux: [premiere]
    difficulte: 3
    duree: 6
    type: code
    enonce: |
      Afficher un sapin de `n` lignes, centré à l'aide d'espaces. Pour `n = 4`, le programme affiche :

      ```
         *
        ***
       *****
      *******
      ```

      Conseil : `" " * 3 + "*"` donne le texte `"   *"`.
    depart: |
      n = 4

    aides:
      - |
        # faire une boucle sur les lignes, numerotees de 0 a n - 1
        #     la ligne numero i contient 2 * i + 1 etoiles
        #     elle commence par n - 1 - i espaces
        #     afficher les espaces suivis des etoiles
      - |
        for i in range(n):
            espaces = " " * (n - 1 - ___)
            etoiles = "*" * (2 * ___ + 1)
            print(___)
      - |
        for i in range(n):
            espaces = " " * (n - 1 - i)
            etoiles = "*" * (2 * i + 1)
            print(___)
    solution: |
      n = 4
      for i in range(n):
          espaces = " " * (n - 1 - i)
          etoiles = "*" * (2 * i + 1)
          print(espaces + etoiles)
