      Écrire une fonction `en_decimal(binaire)` qui reçoit un nombre binaire sous forme de texte et qui renvoie sa valeur. Par exemple, `en_decimal("1011")` renvoie 11.

      On peut lire les chiffres de gauche à droite : à chaque chiffre, la valeur est multipliée par 2, puis on lui ajoute le chiffre lu.
    depart: |
      def en_decimal(binaire):
          ...
    aides:
      - |
        def en_decimal(binaire):
            # creer une variable valeur qui vaut 0
            # parcourir les caracteres de binaire
            #     multiplier valeur par 2 et lui ajouter le chiffre lu
            # renvoyer valeur
      - |
        def en_decimal(binaire):
            valeur = 0
            for chiffre in binaire:
                valeur = valeur * ___ + ___
