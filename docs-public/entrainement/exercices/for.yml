      - |
        def en_decimal(binaire):
            valeur = 0
            for chiffre in binaire:
                valeur = valeur * 2 + int(___)
            return valeur
    solution: |
      def en_decimal(binaire):
          valeur = 0
          for chiffre in binaire:
              valeur = valeur * 2 + int(chiffre)
          return valeur
