exercices:

  - id: compte-a-rebours
    numero: 5
    titre: Compte à rebours
    notion: for
    niveaux: [premiere]
    difficulte: 1
    duree: 3
    type: code
    enonce: |
      Afficher avec une boucle `for` les nombres de 5 à 1, un par ligne, puis `Partez !` sur la dernière ligne.
    depart: |

    aides:
      - |
        # faire une boucle for dont la variable va de 5 a 1
        #     afficher la variable
        # apres la boucle, afficher Partez !
      - |
        for i in range(___, ___, ___):
            print(i)
        print("Partez !")
      - |
        for i in range(5, ___, -1):
            print(i)
        print("Partez !")
    solution: |
      for i in range(5, 0, -1):
          print(i)
      print("Partez !")
    interdit: [while]
    tests:
      - { sortie: "5\n4\n3\n2\n1\nPartez !" }

  - id: compter-voyelles
    numero: 6
    titre: Combien de voyelles ?
    notion: for
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Écrire une fonction `compter_voyelles(mot)` qui renvoie le nombre de voyelles (`a`, `e`, `i`, `o`, `u`, `y`) de `mot`, écrit en minuscules et sans accent.
    depart: |
      def compter_voyelles(mot):
          ...
    aides:
      - |
        def compter_voyelles(mot):
            # creer un compteur qui vaut 0
            # parcourir chaque lettre de mot
            #     si la lettre fait partie de "aeiouy", ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def compter_voyelles(mot):
            compteur = ___
            for lettre in ___:
                if lettre in "aeiouy":
                    compteur = ___
            return ___
      - |
        def compter_voyelles(mot):
            compteur = 0
            for lettre in mot:
                if lettre in "aeiouy":
                    compteur = compteur + 1
            return ___
    solution: |
      def compter_voyelles(mot):
          compteur = 0
          for lettre in mot:
              if lettre in "aeiouy":
                  compteur = compteur + 1
          return compteur
    tests:
      - { appel: "compter_voyelles('python')", attendu: "2" }
      - { appel: "compter_voyelles('ordinateur')", attendu: "5" }
      - { appel: "compter_voyelles('')", attendu: "0", libelle: "compter_voyelles('') : un mot vide" }
      - { appel: "compter_voyelles('bcd')", attendu: "0", cache: true }
      - { appel: "compter_voyelles('aeiouy')", attendu: "6", cache: true }

  - id: predire-range-pas
    numero: 29
    titre: Un pas de 2
    notion: for
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      total = 0
      for i in range(1, 7, 2):
          total = total + i
      print(total)
    choix: ["9", "12", "21", "16"]
    explication: |
      `range(1, 7, 2)` donne 1, 3 et 5 : le 7 est exclu. La somme vaut donc 1 + 3 + 5 = 9.

  - id: table-multiplication
    numero: 30
    titre: La table de multiplication
    notion: for
    niveaux: [premiere]
    difficulte: 1
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Afficher avec une boucle `for` la table de multiplication de `n`, de 1 à 10, avec une ligne de la forme `7 x 1 = 7`.

      Conseil : `print` accepte plusieurs valeurs séparées par des virgules, et il les sépare par un espace.
    depart: |
      n = 7

    aides:
      - |
        # faire une boucle dont la variable va de 1 a 10
        #     afficher n, "x", la variable, "=" et le produit
      - |
        for i in range(___, ___):
            print(n, "x", i, "=", ___)
      - |
        for i in range(1, 11):
            print(n, "x", i, "=", ___)
    solution: |
      n = 7
      for i in range(1, 11):
          print(n, "x", i, "=", n * i)
    tests:
      - sortie: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"

  - id: bug-puissance
    numero: 31
    titre: La puissance qui vaut toujours zéro
    notion: for
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    tags: [maths]
    type: code
    enonce: |
      Cette fonction doit renvoyer `x` à la puissance `n` en multipliant dans une boucle. Elle contient une erreur : elle renvoie toujours 0. La corriger.
    depart: |
      def puissance(x, n):
          resultat = 0
          for i in range(n):
              resultat = resultat * x
          return resultat
    aides:
      - |
        # suivre le code a la main avec x = 2 et n = 3
        # que vaut resultat apres le premier tour de boucle ?
        # par quelle valeur faut-il commencer pour une multiplication ?
      - |
        def puissance(x, n):
            resultat = ___
            for i in range(n):
                resultat = resultat * x
            return resultat
      - |
        def puissance(x, n):
            resultat = 1
            for i in range(___):
                resultat = resultat * x
            return resultat
    solution: |
      def puissance(x, n):
          resultat = 1
          for i in range(n):
              resultat = resultat * x
          return resultat
    tests:
      - { appel: "puissance(2, 3)", attendu: "8" }
      - { appel: "puissance(5, 2)", attendu: "25" }
      - { appel: "puissance(7, 0)", attendu: "1", libelle: "puissance(7, 0) : tout nombre à la puissance 0 vaut 1" }
      - { appel: "puissance(3, 4)", attendu: "81", cache: true }

  - id: factorielle
    numero: 32
    titre: La factorielle
    notion: for
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      La factorielle de `n` est le produit des entiers de 1 à `n`. Par exemple, la factorielle de 4 vaut 1 × 2 × 3 × 4 = 24. Par convention, la factorielle de 0 vaut 1.

      Écrire une fonction `factorielle(n)` qui la renvoie, avec une boucle `for`.
    depart: |
      def factorielle(n):
          ...
    aides:
      - |
        def factorielle(n):
            # creer une variable produit qui vaut 1
            # parcourir les entiers de 1 a n
            #     multiplier produit par l'entier
            # renvoyer produit
      - |
        def factorielle(n):
            produit = ___
            for i in range(___, ___):
                produit = ___
            return produit
      - |
        def factorielle(n):
            produit = 1
            for i in range(1, n + 1):
                produit = ___
            return produit
    solution: |
      def factorielle(n):
          produit = 1
          for i in range(1, n + 1):
              produit = produit * i
          return produit
    autres_solutions:
      - |
        def factorielle(n):
            produit = 1
            for i in range(n):
                produit = produit * (i + 1)
            return produit
    tests:
      - { appel: "factorielle(4)", attendu: "24" }
      - { appel: "factorielle(1)", attendu: "1" }
      - { appel: "factorielle(0)", attendu: "1", libelle: "factorielle(0) : la convention" }
      - { appel: "factorielle(6)", attendu: "720", cache: true }

  - id: retirer-espaces
    numero: 33
    titre: Sans les espaces
    notion: for
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Écrire une fonction `sans_espaces(phrase)` qui renvoie une nouvelle chaîne contenant les caractères de `phrase`, sans les espaces. Par exemple, `sans_espaces("le chat")` renvoie `"lechat"`.
    depart: |
      def sans_espaces(phrase):
          ...
    aides:
      - |
        def sans_espaces(phrase):
            # creer une chaine vide
            # parcourir chaque caractere de phrase
            #     si ce n'est pas un espace, l'ajouter a la fin de la chaine
            # renvoyer la chaine
      - |
        def sans_espaces(phrase):
            resultat = ""
            for caractere in ___:
                if caractere != ___:
                    resultat = ___
            return resultat
      - |
        def sans_espaces(phrase):
            resultat = ""
            for caractere in phrase:
                if caractere != " ":
                    resultat = ___
            return resultat
    solution: |
      def sans_espaces(phrase):
          resultat = ""
          for caractere in phrase:
              if caractere != " ":
                  resultat = resultat + caractere
          return resultat
    tests:
      - { appel: "sans_espaces('le chat')", attendu: "'lechat'" }
      - { appel: "sans_espaces('sansespace')", attendu: "'sansespace'" }
      - { appel: "sans_espaces('   ')", attendu: "''", libelle: "sans_espaces('   ') : que des espaces" }
      - { appel: "sans_espaces(' a b c ')", attendu: "'abc'", cache: true }
      - { appel: "sans_espaces('')", attendu: "''", cache: true }

  - id: suite-de-chiffres
    numero: 34
    titre: La pyramide de chiffres
    notion: for
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Afficher la pyramide suivante pour `n = 4`, avec une seule boucle `for` :

      ```
      1
      12
      123
      1234
      ```

      Conseil : `str` transforme un nombre en texte, et deux textes se collent avec `+`.
    depart: |
      n = 4

    aides:
      - |
        # creer une chaine vide
        # faire une boucle dont la variable va de 1 a n
        #     ajouter la variable, transformee en texte, a la fin de la chaine
        #     afficher la chaine
      - |
        ligne = ""
        for i in range(1, ___):
            ligne = ligne + ___
            print(ligne)
      - |
        ligne = ""
        for i in range(1, n + 1):
            ligne = ligne + str(___)
            print(ligne)
    solution: |
      n = 4
      ligne = ""
      for i in range(1, n + 1):
          ligne = ligne + str(i)
          print(ligne)
    tests:
      - { sortie: "1\n12\n123\n1234" }
    interdit: [while]

  - id: nombre-parfait
    numero: 35
    titre: Les nombres parfaits
    notion: for
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    tags: [maths]
    type: code
    enonce: |
      Un nombre est parfait s'il est égal à la somme de ses diviseurs, sans compter lui-même. Par exemple, 6 est parfait, car 1 + 2 + 3 = 6.

      Écrire une fonction `est_parfait(n)` qui renvoie `True` si l'entier `n` (supérieur ou égal à 2) est parfait, et `False` sinon.
    depart: |
      def est_parfait(n):
          ...
    aides:
      - |
        def est_parfait(n):
            # creer une variable somme qui vaut 0
            # parcourir les entiers de 1 a n - 1
            #     si l'entier divise n, l'ajouter a somme
            # renvoyer le resultat de la comparaison entre somme et n
      - |
        def est_parfait(n):
            somme = 0
            for d in range(1, ___):
                if n % d == ___:
                    somme = ___
            return somme == ___
      - |
        def est_parfait(n):
            somme = 0
            for d in range(1, n):
                if n % d == 0:
                    somme = somme + d
            return ___
    solution: |
      def est_parfait(n):
          somme = 0
          for d in range(1, n):
              if n % d == 0:
                  somme = somme + d
          return somme == n
    autres_solutions:
      - |
        def est_parfait(n):
            somme = 0
            for d in range(1, n // 2 + 1):
                if n % d == 0:
                    somme = somme + d
            if somme == n:
                return True
            else:
                return False
    tests:
      - { appel: "est_parfait(6)", attendu: "True" }
      - { appel: "est_parfait(8)", attendu: "False" }
      - { appel: "est_parfait(28)", attendu: "True" }
      - { appel: "est_parfait(12)", attendu: "False", cache: true }
      - { appel: "est_parfait(496)", attendu: "True", cache: true }
      - { appel: "est_parfait(2)", attendu: "False", cache: true }
