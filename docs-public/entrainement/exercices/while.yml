                somme = 0
                while n > 0:
                    somme = somme + n % 10
                    n = n // 10
                n = ___
            return n
    solution: |
      def reduire(n):
          while n >= 10:
              somme = 0
              while n > 0:
                  somme = somme + n % 10
                  n = n // 10
              n = somme
          return n
