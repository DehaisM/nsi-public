    interdit: [sqrt]
    aides:
      - |
        def racine(x):
            # creer bas qui vaut 0 et haut qui vaut x
            # tant que haut - bas depasse 0.001 :
            #     calculer le milieu de bas et haut
            #     si le carre du milieu est inferieur a x, bas prend la valeur du milieu
            #     sinon, haut prend la valeur du milieu
            # renvoyer bas
      - |
        def racine(x):
            bas = 0
            haut = x
            while haut - bas > ___:
                milieu = (bas + haut) / ___
                if milieu * milieu < x:
                    bas = ___
