    enonce: |
      Écrire une fonction `reduire(n)` qui remplace l'entier positif `n` par la somme de ses chiffres, encore et encore, jusqu'à obtenir un seul chiffre. Par exemple, `reduire(9875)` renvoie 2, car 9 + 8 + 7 + 5 = 29, puis 2 + 9 = 11, puis 1 + 1 = 2.
    depart: |
      def reduire(n):
          ...
    aides:
      - |
        def reduire(n):
            # tant que n a au moins deux chiffres :
            #     calculer la somme de ses chiffres (avec % 10 et // 10, dans une seconde boucle)
            #     remplacer n par cette somme
            # renvoyer n
      - |
        def reduire(n):
            while n >= ___:
                somme = 0
                while n > 0:
                    somme = somme + n % ___
                    n = n // ___
                n = ___
            return n
      - |
