    enonce: |
      Écrire une fonction `est_puissance_de_2(n)` qui renvoie `True` si l'entier `n` (strictement positif) est une puissance de 2, comme 1, 2, 4, 8 ou 16, et `False` sinon.

      Conseil : diviser `n` par 2 tant que c'est possible, puis regarder ce qu'il reste.
    depart: |
