  - id: bug-tirelire
    numero: 37
    titre: La tirelire
    notion: while
    niveaux: [premiere]
    difficulte: 1
    duree: 3
    type: code
    enonce: |
      Chaque semaine, un élève met `depot` euros dans sa tirelire, et il veut atteindre au moins `objectif` euros.

      Cette fonction doit renvoyer le nombre de semaines nécessaires, mais elle contient une erreur : `semaines(30, 10)` renvoie 4 au lieu de 3. La corriger.
    depart: |
      def semaines(objectif, depot):
          total = 0
          compteur = 0
          while total <= objectif:
              total = total + depot
              compteur = compteur + 1
          return compteur
    aides:
      - |
        # suivre le code a la main avec objectif = 30 et depot = 10
        # quand total vaut 30, l'objectif est-il atteint ?
        # la boucle doit-elle continuer dans ce cas ?
      - |
        def semaines(objectif, depot):
            total = 0
            compteur = 0
            while total ___ objectif:
                total = total + depot
                compteur = compteur + 1
            return compteur
      - |
        def semaines(objectif, depot):
            total = 0
            compteur = 0
            while total < ___:
                total = total + depot
                compteur = compteur + 1
            return compteur
    solution: |
      def semaines(objectif, depot):
          total = 0
          compteur = 0
          while total < objectif:
              total = total + depot
              compteur = compteur + 1
          return compteur
    tests:
      - { appel: "semaines(30, 10)", attendu: "3" }
      - { appel: "semaines(35, 10)", attendu: "4" }
      - { appel: "semaines(5, 10)", attendu: "1" }
      - { appel: "semaines(0, 10)", attendu: "0", cache: true }
