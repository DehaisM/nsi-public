  - id: pgcd-soustractions
    numero: 41
    titre: Le PGCD par soustractions
    notion: while
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    tags: [maths]
    type: code
    enonce: |
      Pour calculer le PGCD de deux entiers strictement positifs, on peut répéter cette étape tant qu'ils sont différents : remplacer le plus grand par la différence entre le plus grand et le plus petit. Quand ils sont égaux, leur valeur commune est le PGCD.

      Écrire une fonction `pgcd(a, b)` qui applique cette méthode. Par exemple, `pgcd(12, 18)` renvoie 6.
    depart: |
      def pgcd(a, b):
          ...
    aides:
      - |
        def pgcd(a, b):
            # tant que a et b sont differents :
            #     si a est plus grand que b, retirer b a a
            #     sinon, retirer a a b
            # renvoyer a
      - |
        def pgcd(a, b):
            while a != ___:
                if a > b:
                    a = ___
                else:
                    b = ___
            return ___
      - |
        def pgcd(a, b):
            while a != b:
                if a > b:
                    a = a - b
                else:
                    b = ___
            return a
    solution: |
      def pgcd(a, b):
          while a != b:
              if a > b:
                  a = a - b
              else:
                  b = b - a
          return a
    autres_solutions:
      - |
        def pgcd(a, b):
            while b != 0:
                a, b = b, a % b
            return a
    tests:
      - { appel: "pgcd(12, 18)", attendu: "6" }
      - { appel: "pgcd(7, 7)", attendu: "7" }
      - { appel: "pgcd(17, 5)", attendu: "1" }
      - { appel: "pgcd(100, 75)", attendu: "25", cache: true }
      - { appel: "pgcd(1, 9)", attendu: "1", cache: true }

