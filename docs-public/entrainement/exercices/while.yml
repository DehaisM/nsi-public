  - id: rebonds-balle
    numero: 40
    titre: Les rebonds de la balle
    notion: while
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Une balle lâchée d'une hauteur `hauteur` remonte à la moitié de cette hauteur à chaque rebond.

      Écrire une fonction `rebonds(hauteur)` qui renvoie le nombre de rebonds nécessaires pour que la balle remonte à moins d'un mètre (strictement). Par exemple, `rebonds(8)` renvoie 4, car la balle remonte à 4, 2, 1, puis 0.5 mètre.
    depart: |
      def rebonds(hauteur):
          ...
    aides:
      - |
        def rebonds(hauteur):
            # creer un compteur qui vaut 0
            # tant que la hauteur vaut au moins 1 :
            #     diviser la hauteur par 2
            #     ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def rebonds(hauteur):
            compteur = 0
            while hauteur >= ___:
                hauteur = ___
                compteur = ___
            return compteur
      - |
        def rebonds(hauteur):
            compteur = 0
            while hauteur >= 1:
                hauteur = hauteur / 2
                compteur = ___
            return compteur
    solution: |
      def rebonds(hauteur):
          compteur = 0
          while hauteur >= 1:
              hauteur = hauteur / 2
              compteur = compteur + 1
          return compteur
    tests:
