    enonce: |
      Écrire une fonction `racine(x)` qui renvoie une valeur approchée de la racine carrée de `x` (avec `x` supérieur ou égal à 1), sans utiliser `math.sqrt` ni `**`.

      Méthode : la racine se trouve entre `bas = 0` et `haut = x`. Tant que l'écart entre `bas` et `haut` dépasse 0.001, on regarde le milieu : si son carré est inférieur à `x`, la racine est au-dessus du milieu, sinon elle est en dessous. On renvoie `bas` à la fin.
