    enonce: |
      Écrire une fonction `prochain_multiple(n, m)` qui renvoie le plus petit multiple de `m` supérieur ou égal à `n`, avec une boucle `while`. Par exemple, `prochain_multiple(10, 4)` renvoie 12.
    depart: |
      def prochain_multiple(n, m):
          ...
    aides:
      - |
        def prochain_multiple(n, m):
            # tant que n n'est pas un multiple de m :
            #     ajouter 1 a n
            # renvoyer n
      - |
        def prochain_multiple(n, m):
            while n % m != ___:
                n = ___
            return n
