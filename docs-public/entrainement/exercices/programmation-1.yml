  - id: piege-corriger-parenthese
    numero: 320
    titre: Corriger la parenthèse
    notion: programmation-1
    niveaux: [seconde]
    difficulte: 1
    duree: 1
    type: code
    enonce: |
      Ce programme doit afficher `Bonjour Arwen`. Il provoque une erreur : la lire, puis corriger le programme.
    depart: |
      prenom = "Arwen"
      print("Bonjour", prenom
    aides:
      - idee: |
          Compter les parenthèses de la ligne 2 : y en a-t-il autant qui s'ouvrent que qui se ferment ?
      - ou: |
          L'erreur est à la fin de la ligne 2 : il manque quelque chose après `prenom`.
    solution: |
      prenom = "Arwen"
      print("Bonjour", prenom)
    tests:
      - { sortie: "Bonjour Arwen" }

