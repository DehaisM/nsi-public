  - id: piege-ordre-somme
    numero: 324
    titre: Remettre dans l'ordre
    notion: programmation-1
    niveaux: [seconde]
    difficulte: 3
    duree: 3
    type: code
    enonce: |
      En remettant ces quatre lignes dans le bon ordre, sans les modifier, le programme doit afficher 15.
    depart: |
      c = a + b
      print(c)
      a = 5
      b = a * 2
    aides:
      - idee: |
          Chercher la ligne qui n'utilise aucune autre variable : c'est elle qui vient en premier. Puis chercher celle qui n'utilise que des variables déjà créées, et ainsi de suite.
      - ou: |
          L'ordre attendu commence par `a = 5`. Il reste à placer les trois autres lignes.
    solution: |
      a = 5
      b = a * 2
      c = a + b
      print(c)
    tests:
      - { variable: c, attendu: "15" }
      - { sortie: "15" }
