  - id: piege-corriger-int-parenthese
    numero: 342
    titre: Corriger la parenthèse de int
    notion: programmation-2
    niveaux: [seconde]
    difficulte: 1
    duree: 1
    type: code
    enonce: |
      Ce programme doit afficher 16. Il provoque une erreur : la lire, puis corriger le programme.
    depart: |
      n = int("8"
      print(n * 2)
    aides:
      - idee: |
          Compter les parenthèses de la ligne 1 : y en a-t-il autant qui s'ouvrent que qui se ferment ?
      - ou: |
          L'erreur est à la fin de la ligne 1 : la parenthèse de `int` n'est pas refermée.
    solution: |
      n = int("8")
      print(n * 2)
    tests:
      - { sortie: "16" }

  - id: piege-corriger-moyenne
    numero: 343
    titre: La moyenne trop grande
    notion: programmation-2
    niveaux: [seconde]
    difficulte: 2
    duree: 2
    type: code
    enonce: |
      Ce programme doit afficher la moyenne de `a` et `b`, c'est-à-dire 14.0. Il n'affiche pas d'erreur, mais il affiche 20.0. Le corriger.
    depart: |
      a = 12
      b = 16
      moyenne = a + b / 2
      print(moyenne)
    aides:
      - idee: |
          Faire le calcul à la main, dans l'ordre où Python le fait : la division passe avant l'addition.
      - ou: |
          L'erreur est à la ligne 3 : il faut que l'addition soit faite avant la division.
    solution: |
      a = 12
      b = 16
      moyenne = (a + b) / 2
      print(moyenne)
    tests:
      - { variable: moyenne, attendu: "14.0" }
      - { sortie: "14.0" }

  - id: piege-corriger-texte-fois
    numero: 344
    titre: Le total qui se répète
    notion: programmation-2
    niveaux: [seconde]
    difficulte: 3
    duree: 2
