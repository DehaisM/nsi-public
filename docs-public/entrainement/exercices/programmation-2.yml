      - ou: |
          L'erreur est à la ligne 2 : `prix` est un texte, qu'il faut transformer en nombre avant de multiplier.
    solution: |
      prix = "12"
      total = int(prix) * 3
      print(total)
    tests:
      - { variable: total, attendu: "36" }
      - { sortie: "36" }

