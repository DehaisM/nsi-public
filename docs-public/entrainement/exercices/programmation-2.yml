    enonce: |
      Ce programme doit afficher le prix de 3 places à 12 euros, c'est-à-dire 36. Il n'affiche pas d'erreur, mais il affiche 121212. Le corriger, sans changer la ligne 1.
    depart: |
      prix = "12"
