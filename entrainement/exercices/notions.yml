# Banque d'exercices de la page Entrainement : la liste des notions, puis un fichier par notion
# (variables.yml, conditions.yml...) qui contient une liste "exercices:".
#
# Champs communs :
#   id         identifiant unique, minuscules et tirets (sert dans l'adresse de la page)
#   numero     entier unique qui sert au code de sauvegarde des eleves : prendre le prochain
#              numero libre, ne jamais changer ni reutiliser celui d'un exercice existant
#   titre      titre court
#   notion     une des notions listees ci-dessous
#   niveaux    liste : seconde et/ou premiere (doit contenir le niveau de la notion)
#   difficulte 1, 2 ou 3
#   duree      duree indicative en minutes (pour les types code et prediction)
#   tags       facultatif, par exemple [maths] : prevu pour de futurs filtres
#   type       code : l'eleve ecrit du code, verifie par des tests
#              prediction : l'eleve predit ce qu'affiche un code
#              qcm : question de cours a choix (Seconde)
#              reponse : question de cours a reponse courte, a taper (Seconde)
#              generateur : question de calcul a valeurs tirees au hasard (Seconde)
#
# Pour le type code :
#   enonce, depart (code de depart), aides (3 niveaux), solution, tests
#   autres_solutions (facultatif) : d'autres bonnes reponses, pour verifier que les tests les acceptent
#   interdit (facultatif) : noms interdits, plus "[:]" pour les tranches et "in" pour le test d'appartenance
#   Un test est l'un de ces trois genres (ajouter cache: true pour ne pas montrer le cas a l'eleve) :
#     - appel: compter([1, 2], 1)     attendu: "1"
#     - variable: total               attendu: "27"
#     - sortie: "Bonjour"
#
# Pour le type prediction :
#   enonce, code, choix (liste de textes), explication
#   La bonne reponse est toujours le PREMIER choix : la page melange ensuite les choix,
#   et le verificateur controle que c'est bien ce que le code affiche.
#
# Pour le type qcm :
#   enonce, choix (de 3 a 5 textes), explication, cours (le passage du cours a relire)
#   La bonne reponse est toujours le PREMIER choix : la page melange ensuite les choix.
#   image (facultatif) : un fichier du dossier entrainement/images, avec image_alt pour le decrire
#
# Pour le type reponse :
#   enonce, reponses (les reponses acceptees, la premiere est celle affichee), explication, cours
#   indication (facultatif) : ce qu'on attend, affiche dans la case, par exemple "Un nombre"
#   calcul (facultatif) : une expression Python qui refait le calcul ; le verificateur controle
#   qu'elle donne bien une des reponses acceptees. Les modules ipaddress et math sont disponibles.
#   La page ignore les espaces et les majuscules, et accepte la virgule comme le point.
#
# Pour le type generateur :
#   generateur (le nom d'un generateur de entrainement/generateurs.js), cours
#   L'enonce, la reponse et l'explication sont fabriques a chaque essai, avec de nouvelles valeurs.
#   Apres une modification de generateurs.js, lancer : python outils/controler_generateurs.py
#
# Chaque notion appartient a un niveau : premiere par defaut, ou niveau: seconde.
# La page n'affiche que les notions du niveau choisi par l'eleve.
#
# Apres chaque modification, lancer : python outils/verifier_exercices.py

notions:
  - { id: variables, nom: "Variables" }
  - { id: conditions, nom: "Conditions" }
  - { id: for, nom: "Boucles for" }
  - { id: while, nom: "Boucles while" }
  - { id: fonctions, nom: "Fonctions" }
  - { id: listes, nom: "Listes" }
  - { id: grilles, nom: "Grilles" }
  - { id: internet-1, nom: "Internet, chapitre 1", niveau: seconde }
  - { id: internet-2, nom: "Internet, chapitre 2", niveau: seconde }
