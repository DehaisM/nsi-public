  - id: predire-et-ou
    numero: 74
    titre: Et, ou
    notion: conditions
    niveaux: [premiere]
    difficulte: 2
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = 5
      print(a > 3 and a < 4, a > 3 or a < 4)
    choix: ["False True", "True False", "True True", "False False"]
    explication: |
      `a > 3` est vrai et `a < 4` est faux. Avec `and`, les deux doivent être vrais : le résultat est `False`. Avec `or`, il suffit qu'un seul le soit : le résultat est `True`.

  - id: predire-if-successifs
    numero: 75
    titre: Deux if à la suite
    notion: conditions
    niveaux: [premiere]
    difficulte: 2
    duree: 2
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      x = 8
      if x > 5:
          x = x - 5
      if x < 5:
          x = x + 10
      print(x)
    choix: ["13", "3", "8", "18"]
