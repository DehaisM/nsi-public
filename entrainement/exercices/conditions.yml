  - id: mediane-trois
    numero: 79
    titre: Le nombre du milieu
    notion: conditions
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `milieu(a, b, c)` qui renvoie la médiane des trois nombres, c'est-à-dire celui qui se trouve au milieu quand on les range dans l'ordre. Par exemple, `milieu(3, 1, 2)` renvoie 2.
    depart: |
      def milieu(a, b, c):
          ...
    interdit: [sorted, sort, min, max]
    aides:
      - |
        def milieu(a, b, c):
            # b est au milieu s'il est entre a et c, dans un sens ou dans l'autre
            # a est au milieu s'il est entre b et c, dans un sens ou dans l'autre
            # sinon, c'est c
      - |
        def milieu(a, b, c):
            if (a <= b and b <= c) or (c <= b and b <= ___):
                return b
            if (b <= a and a <= ___) or (c <= a and a <= ___):
                return a
            return ___
      - |
        def milieu(a, b, c):
            if (a <= b and b <= c) or (c <= b and b <= a):
                return b
            if (b <= a and a <= c) or (c <= a and a <= b):
                return ___
            return ___
    solution: |
      def milieu(a, b, c):
          if (a <= b and b <= c) or (c <= b and b <= a):
              return b
          if (b <= a and a <= c) or (c <= a and a <= b):
              return a
          return c
    autres_solutions:
      - |
        def milieu(a, b, c):
            if a > b:
                a, b = b, a
            if b > c:
                b, c = c, b
            if a > b:
                a, b = b, a
            return b
    tests:
      - { appel: "milieu(1, 2, 3)", attendu: "2" }
