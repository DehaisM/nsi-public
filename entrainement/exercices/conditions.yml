  - id: bug-tarif-bus
    numero: 73
    titre: Le tarif du bus
    notion: conditions
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Le bus est gratuit pour les moins de 4 ans, coûte 1 euro pour les moins de 18 ans, et 2 euros pour les autres. Cette fonction contient une erreur : `tarif_bus(4)` renvoie 0 au lieu de 1. La corriger.
