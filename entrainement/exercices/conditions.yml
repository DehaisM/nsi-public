  - id: longueur-commune
    numero: 80
    titre: Deux intervalles qui se croisent
    notion: conditions
    niveaux: [premiere]
    difficulte: 3
    duree: 6
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `commun(a, b, c, d)` qui renvoie la longueur de la partie commune aux intervalles `[a, b]` et `[c, d]`, sans utiliser `min` ni `max`. Par exemple, `commun(0, 5, 3, 8)` renvoie 2, car ils ont en commun `[3, 5]`. S'ils ne se croisent pas, la fonction renvoie 0.

      On suppose que `a <= b` et `c <= d`.
    depart: |
      def commun(a, b, c, d):
          ...
    interdit: [min, max]
    aides:
      - |
        def commun(a, b, c, d):
            # la partie commune commence au plus grand des deux debuts
            # elle finit a la plus petite des deux fins
            # si elle finit avant de commencer, il n'y a rien en commun
            # sinon, renvoyer sa longueur
      - |
        def commun(a, b, c, d):
            debut = a
            if c > a:
                debut = ___
            fin = b
            if d < b:
                fin = ___
            if fin < debut:
                return ___
            return ___
      - |
        def commun(a, b, c, d):
            debut = a
            if c > a:
                debut = c
            fin = b
            if d < b:
                fin = d
            if fin < debut:
                return 0
            return ___
    solution: |
      def commun(a, b, c, d):
          debut = a
          if c > a:
              debut = c
          fin = b
          if d < b:
              fin = d
          if fin < debut:
              return 0
          return fin - debut
    tests:
      - { appel: "commun(0, 5, 3, 8)", attendu: "2" }
      - { appel: "commun(0, 2, 5, 8)", attendu: "0", libelle: "commun(0, 2, 5, 8) : ils ne se croisent pas" }
      - { appel: "commun(1, 9, 3, 4)", attendu: "1", libelle: "commun(1, 9, 3, 4) : l'un est dans l'autre" }
      - { appel: "commun(3, 8, 0, 5)", attendu: "2", cache: true }
      - { appel: "commun(5, 8, 0, 2)", attendu: "0", cache: true }
      - { appel: "commun(0, 5, 5, 8)", attendu: "0", cache: true }
      - { appel: "commun(3, 4, 1, 9)", attendu: "1", cache: true }
