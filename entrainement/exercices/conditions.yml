  - id: vainqueur-set
    numero: 76
    titre: Le set de tennis
    notion: conditions
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    type: code
    enonce: |
      Au tennis, on gagne un set en atteignant au moins 6 jeux avec au moins 2 jeux d'écart.

      Écrire une fonction `vainqueur(a, b)` qui reçoit les jeux gagnés par les joueurs A et B, et qui renvoie `"A"`, `"B"` ou `"en cours"` si personne n'a encore gagné.
    depart: |
      def vainqueur(a, b):
          ...
    aides:
      - |
        def vainqueur(a, b):
            # A gagne s'il a au moins 6 jeux et au moins 2 jeux de plus que B
            # B gagne dans le cas symetrique
            # sinon, le set continue
      - |
        def vainqueur(a, b):
            if a >= 6 and a - b >= ___:
                return "A"
            if b >= ___ and b - a >= ___:
                return "B"
            return ___
      - |
        def vainqueur(a, b):
            if a >= 6 and a - b >= 2:
                return "A"
            if b >= 6 and b - a >= 2:
                return "B"
            return ___
    solution: |
      def vainqueur(a, b):
          if a >= 6 and a - b >= 2:
              return "A"
          if b >= 6 and b - a >= 2:
              return "B"
          return "en cours"
    tests:
      - { appel: "vainqueur(6, 4)", attendu: "'A'" }
      - { appel: "vainqueur(3, 6)", attendu: "'B'" }
      - { appel: "vainqueur(6, 5)", attendu: "'en cours'", libelle: "vainqueur(6, 5) : un seul jeu d'écart" }
      - { appel: "vainqueur(7, 5)", attendu: "'A'", cache: true }
      - { appel: "vainqueur(5, 3)", attendu: "'en cours'", cache: true }
      - { appel: "vainqueur(3, 5)", attendu: "'en cours'", cache: true }
      - { appel: "vainqueur(5, 7)", attendu: "'B'", cache: true }
      - { appel: "vainqueur(5, 6)", attendu: "'en cours'", cache: true }

  - id: forfait-telephone
    numero: 77
    titre: Le forfait de téléphone
    notion: conditions
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Un forfait coûte 10 euros et comprend 20 Go. Chaque Go supplémentaire coûte 2 euros.

      Écrire une fonction `cout(go)` qui renvoie le prix à payer pour une consommation de `go` Go (un nombre entier).
    depart: |
      def cout(go):
          ...
    aides:
      - |
        def cout(go):
            # si la consommation ne depasse pas 20 Go, le prix est celui du forfait
            # sinon, calculer le nombre de Go en trop et ajouter leur prix au forfait
      - |
        def cout(go):
            if go <= ___:
                return ___
            return 10 + (go - ___) * ___
      - |
        def cout(go):
