      def tarif_bus(age):
          if age <= 4:
              return 0
          elif age < 18:
              return 1
          else:
              return 2
    aides:
      - |
        # une personne de 4 ans a-t-elle moins de 4 ans ?
        # quel operateur traduit "moins de 4 ans" ?
      - |
        def tarif_bus(age):
            if age ___ 4:
                return 0
            elif age < 18:
                return 1
            else:
                return 2
      - |
        def tarif_bus(age):
            if age < 4:
                return ___
            elif age < 18:
                return 1
            else:
                return 2
    solution: |
      def tarif_bus(age):
          if age < 4:
              return 0
          elif age < 18:
              return 1
          else:
              return 2
    tests:
