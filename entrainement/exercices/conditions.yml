  - id: heure-valide
    numero: 72
    titre: Une heure valide
    notion: conditions
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Écrire une fonction `heure_valide(h, m)` qui renvoie `True` si `h` est compris entre 0 et 23 et `m` entre 0 et 59 (bornes incluses), et `False` sinon.
    depart: |
      def heure_valide(h, m):
          ...
    aides:
      - |
        def heure_valide(h, m):
            # les deux conditions doivent etre vraies en meme temps
            # chacune porte sur une borne basse et une borne haute
      - |
        def heure_valide(h, m):
            if h >= ___ and h <= ___ and m >= ___ and m <= ___:
                return True
            return False
      - |
        def heure_valide(h, m):
            if h >= 0 and h <= 23 and m >= 0 and m <= 59:
                return ___
            return ___
    solution: |
      def heure_valide(h, m):
          if h >= 0 and h <= 23 and m >= 0 and m <= 59:
              return True
          return False
