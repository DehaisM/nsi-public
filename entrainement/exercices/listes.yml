  - id: garder-grands
    numero: 11
    titre: Le manège
    notion: listes
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Écrire une fonction `autorises(tailles, minimum)` qui renvoie une **nouvelle** liste contenant les tailles supérieures ou égales à `minimum`, dans le même ordre. La liste `tailles` ne doit pas être modifiée.
    depart: |
      def autorises(tailles, minimum):
          ...
    aides:
      - |
        def autorises(tailles, minimum):
            # creer une liste vide
            # parcourir les tailles
            #     si la taille est assez grande, l'ajouter a la nouvelle liste
            # renvoyer la nouvelle liste
      - |
        def autorises(tailles, minimum):
            resultat = ___
            for t in tailles:
                if t >= ___:
                    resultat.append(___)
            return ___
      - |
        def autorises(tailles, minimum):
            resultat = []
            for t in tailles:
                if t >= minimum:
                    resultat.append(___)
            return resultat
    solution: |
      def autorises(tailles, minimum):
          resultat = []
          for t in tailles:
              if t >= minimum:
                  resultat.append(t)
          return resultat
