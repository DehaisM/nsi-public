      - { appel: "indice_max([9, 1, 2])", attendu: "0", cache: true }
      - { appel: "indice_max([1, 2, 9])", attendu: "2", cache: true }

  - id: sommes-cumulees
    numero: 54
    titre: Les sommes cumulées
    notion: listes
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `cumul(valeurs)` qui renvoie une nouvelle liste dont chaque élément est la somme des éléments de `valeurs` jusqu'à cette position. Par exemple, `cumul([1, 2, 3])` renvoie `[1, 3, 6]`.
    depart: |
      def cumul(valeurs):
          ...
    aides:
      - |
        def cumul(valeurs):
            # creer une liste vide et un total qui vaut 0
            # parcourir les valeurs
            #     ajouter la valeur au total
            #     ajouter le total a la liste
            # renvoyer la liste
      - |
        def cumul(valeurs):
            resultat = []
            total = 0
            for v in valeurs:
                total = ___
                resultat.append(___)
            return resultat
      - |
        def cumul(valeurs):
            resultat = []
            total = 0
            for v in valeurs:
                total = total + v
                resultat.append(___)
            return resultat
    solution: |
      def cumul(valeurs):
          resultat = []
          total = 0
          for v in valeurs:
              total = total + v
              resultat.append(total)
          return resultat
    autres_solutions:
      - |
        def cumul(valeurs):
            resultat = []
            for i in range(len(valeurs)):
                if i == 0:
                    resultat.append(valeurs[0])
                else:
                    resultat.append(resultat[i - 1] + valeurs[i])
            return resultat
    tests:
      - { appel: "cumul([1, 2, 3])", attendu: "[1, 3, 6]" }
      - { appel: "cumul([])", attendu: "[]", libelle: "cumul([]) : une liste vide" }
      - { appel: "cumul([5, -5, 2])", attendu: "[5, 0, 2]" }
      - { appel: "cumul([4])", attendu: "[4]", cache: true }
      - appel: "(lambda L: (cumul(L), L)[1])([1, 2])"
        attendu: "[1, 2]"
        libelle: "La liste de départ n'est pas modifiée"
        cache: true

  - id: liste-triee
    numero: 55
    titre: La liste est-elle triée ?
    notion: listes
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    type: code
    enonce: |
      Écrire une fonction `est_triee(valeurs)` qui renvoie `True` si les éléments de la liste sont rangés dans l'ordre croissant (deux éléments voisins peuvent être égaux), et `False` sinon. Une liste vide ou d'un seul élément est considérée comme triée.
    depart: |
      def est_triee(valeurs):
          ...
    interdit: [sorted, sort]
    aides:
      - |
        def est_triee(valeurs):
            # parcourir les indices, sauf le dernier
            #     si l'element est plus grand que son voisin de droite, renvoyer False
            # apres la boucle, renvoyer True
      - |
        def est_triee(valeurs):
            for i in range(len(valeurs) - ___):
                if valeurs[i] > valeurs[___]:
                    return ___
            return ___
      - |
        def est_triee(valeurs):
            for i in range(len(valeurs) - 1):
                if valeurs[i] > valeurs[i + 1]:
                    return False
            return ___
    solution: |
      def est_triee(valeurs):
          for i in range(len(valeurs) - 1):
              if valeurs[i] > valeurs[i + 1]:
                  return False
          return True
    autres_solutions:
      - |
        def est_triee(valeurs):
            i = 1
            while i < len(valeurs):
                if valeurs[i - 1] > valeurs[i]:
                    return False
                i = i + 1
            return True
    tests:
      - { appel: "est_triee([1, 2, 3])", attendu: "True" }
      - { appel: "est_triee([1, 3, 2])", attendu: "False" }
      - { appel: "est_triee([2, 2, 5])", attendu: "True", libelle: "est_triee([2, 2, 5]) : deux éléments égaux" }
      - { appel: "est_triee([])", attendu: "True", libelle: "est_triee([]) : une liste vide" }
      - { appel: "est_triee([3, 1, 2])", attendu: "False", cache: true }
      - { appel: "est_triee([1, 2, 3, 0])", attendu: "False", cache: true }
      - { appel: "est_triee([8])", attendu: "True", cache: true }
