    enonce: |
      Écrire une fonction `indice_max(valeurs)` qui renvoie l'indice du plus grand élément d'une liste non vide, sans utiliser `max`. Si le plus grand élément apparaît plusieurs fois, renvoyer le premier indice.
    depart: |
      def indice_max(valeurs):
          ...
    interdit: [max]
    aides:
      - |
        def indice_max(valeurs):
            # garder en memoire l'indice du meilleur element, en commencant par 0
            # parcourir les indices de la liste
            #     si l'element est plus grand que le meilleur, retenir son indice
            # renvoyer l'indice retenu
      - |
        def indice_max(valeurs):
            meilleur = 0
            for i in range(len(___)):
                if valeurs[i] > valeurs[___]:
                    meilleur = ___
            return meilleur
      - |
        def indice_max(valeurs):
            meilleur = 0
            for i in range(len(valeurs)):
                if valeurs[i] > valeurs[meilleur]:
