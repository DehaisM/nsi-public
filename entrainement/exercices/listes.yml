      - { appel: "jours_positifs([0, 1])", attendu: "1", libelle: "jours_positifs([0, 1]) : 0 n'est pas strictement positif" }
      - { appel: "jours_positifs([])", attendu: "0", cache: true }
      - { appel: "jours_positifs([1, 2, 3, 4])", attendu: "4", cache: true }

  - id: indice-du-maximum
    numero: 53
    titre: Où est le plus grand ?
