  - id: compter-positifs
    numero: 52
    titre: Les températures positives
    notion: listes
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Écrire une fonction `jours_positifs(temperatures)` qui renvoie le nombre de températures strictement positives de la liste.
    depart: |
      def jours_positifs(temperatures):
          ...
    aides:
      - |
        def jours_positifs(temperatures):
            # creer un compteur qui vaut 0
            # parcourir les temperatures
            #     si la temperature est strictement positive, ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def jours_positifs(temperatures):
            compteur = 0
            for t in ___:
                if t > ___:
                    compteur = ___
            return compteur
      - |
        def jours_positifs(temperatures):
            compteur = 0
            for t in temperatures:
                if t > 0:
                    compteur = ___
            return compteur
    solution: |
      def jours_positifs(temperatures):
          compteur = 0
          for t in temperatures:
              if t > 0:
                  compteur = compteur + 1
          return compteur
