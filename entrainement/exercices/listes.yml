  - id: predire-indices
    numero: 9
    titre: Les indices négatifs
    notion: listes
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      L = [3, 8, 1, 6]
      print(L[-1] + L[1])
    choix: ["14", "4", "9", "7"]
