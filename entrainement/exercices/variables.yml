exercices:

  - id: solde-cantine
    numero: 1
    titre: Le solde de la cantine
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Une carte de cantine contient `solde` euros, et un repas coûte `repas` euros.

      Créer une variable `reste` qui contient le solde après **deux** repas, en utilisant les variables `solde` et `repas`. Puis afficher `reste`.
    depart: |
      solde = 20
      repas = 3.5

    aides:
      - |
        # calculer ce que coutent deux repas
        # le retirer du solde et le ranger dans une variable reste
        # afficher reste
      - |
        reste = solde - ___
        print(___)
      - |
        reste = solde - 2 * repas
        print(___)
    solution: |
      solde = 20
      repas = 3.5
      reste = solde - 2 * repas
      print(reste)
    tests:
      - { variable: reste, attendu: "13.0" }
      - { sortie: "13.0" }

  - id: predire-affectation
    numero: 2
    titre: Qui vaut quoi ?
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = 5
      b = a
      a = a + 2
      print(a, b)
    choix: ["7 5", "7 7", "5 7", "5 5"]
    explication: |
      À la ligne 2, `b` reçoit la valeur de `a` à cet instant, c'est-à-dire 5. Modifier `a` ensuite ne change pas `b`.

  - id: initiales
    numero: 16
    titre: Les initiales
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Créer une variable `initiales` qui contient la première lettre de `prenom` suivie de la première lettre de `nom`, sans écrire ces lettres directement. Puis afficher `initiales`.
    depart: |
      prenom = "Ada"
      nom = "Lovelace"

    aides:
      - |
        # recuperer la premiere lettre de prenom
        # recuperer la premiere lettre de nom
        # les coller avec + et ranger le resultat dans initiales
        # afficher initiales
      - |
        initiales = prenom[___] + nom[___]
        print(___)
      - |
        initiales = prenom[0] + nom[0]
        print(___)
    solution: |
      prenom = "Ada"
      nom = "Lovelace"
      initiales = prenom[0] + nom[0]
      print(initiales)
    tests:
      - { variable: initiales, attendu: "'AL'" }
      - { sortie: "AL" }

  - id: predire-division
    numero: 17
    titre: Quotient et reste
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    tags: [maths]
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = 17
      b = 5
      print(a // b, a % b)
    choix: ["3 2", "3.4 2", "2 3", "3 0.4"]
    explication: |
      `//` donne le quotient de la division entière et `%` donne le reste : 17 = 5 × 3 + 2.

  - id: bug-message-age
    numero: 18
    titre: Le message qui plante
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Ce programme doit afficher `J'ai 16 ans`, mais il provoque une erreur. La lire, puis corriger le programme sans changer la valeur de `age`.
    depart: |
      age = 16
      message = "J'ai " + age + " ans"
      print(message)
    aides:
      - |
        # lire le message d'erreur : quels types essaie-t-on d'additionner ?
        # quelle fonction transforme un nombre en texte ?
      - |
        age = 16
        message = "J'ai " + ___(age) + " ans"
        print(message)
      - |
        age = 16
        message = "J'ai " + str(___) + " ans"
        print(message)
    solution: |
      age = 16
      message = "J'ai " + str(age) + " ans"
      print(message)
    tests:
      - variable: message
        attendu: '"J''ai 16 ans"'
      - { sortie: "J'ai 16 ans" }

  - id: predire-texte-fois-nombre
    numero: 19
    titre: Un texte multiplié
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = "3"
      b = 2
      print(a * b)
    choix: ["33", "6", "32", "Une erreur"]
    explication: |
      `a` est le **texte** `"3"`, pas le nombre 3. Multiplier un texte par 2 le répète deux fois.

  - id: convertir-secondes
    numero: 20
    titre: La durée de la vidéo
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Une vidéo dure `total` secondes. Créer une variable `minutes` qui contient le nombre de minutes complètes et une variable `secondes` qui contient les secondes restantes, en utilisant `total`. Puis afficher `minutes` et `secondes` avec un seul `print`.

      Pour 200 secondes, le programme affiche `3 20`.
    depart: |
      total = 200

    aides:
      - |
        # une minute dure 60 secondes
        # le quotient de la division entiere donne les minutes
        # le reste de la division donne les secondes
        # afficher les deux valeurs
      - |
        minutes = total // ___
        secondes = total % ___
        print(___, ___)
      - |
        minutes = total // 60
        secondes = total % ___
        print(minutes, secondes)
    solution: |
      total = 200
      minutes = total // 60
      secondes = total % 60
      print(minutes, secondes)
    autres_solutions:
      - |
        total = 200
        minutes = total // 60
        secondes = total - minutes * 60
        print(minutes, secondes)
    tests:
      - { variable: minutes, attendu: "3" }
      - { variable: secondes, attendu: "20" }
      - { sortie: "3 20" }

  - id: moyenne-coefficients
    numero: 21
    titre: La moyenne avec coefficients
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Une note `note1` a pour coefficient `coef1` et une note `note2` a pour coefficient `coef2`. Créer une variable `moyenne` qui contient la moyenne pondérée de ces deux notes, puis l'afficher.

      Pour rappel, chaque note est multipliée par son coefficient, et la somme obtenue est divisée par la somme des coefficients.
    depart: |
      note1 = 14
      coef1 = 3
      note2 = 10
      coef2 = 2

    aides:
      - |
        # calculer la somme note * coefficient pour les deux notes
        # calculer la somme des coefficients
        # diviser la premiere somme par la seconde
        # afficher le resultat
      - |
        moyenne = (note1 * ___ + note2 * ___) / (___ + ___)
        print(moyenne)
      - |
        moyenne = (note1 * coef1 + note2 * coef2) / (___ + ___)
        print(moyenne)
    solution: |
      note1 = 14
      coef1 = 3
      note2 = 10
      coef2 = 2
      moyenne = (note1 * coef1 + note2 * coef2) / (coef1 + coef2)
      print(moyenne)
    tests:
      - { variable: moyenne, attendu: "12.4" }
      - { sortie: "12.4" }

  - id: prix-ttc
    numero: 61
    titre: Le prix TTC
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    tags: [maths]
    type: code
    enonce: |
      Un article coûte `ht` euros hors taxes, avec une TVA de `tva` pour cent. Créer une variable `ttc` qui contient le prix avec la TVA, en utilisant les variables `ht` et `tva`. Puis afficher `ttc`.
    depart: |
      ht = 50
      tva = 20

    aides:
      - |
        # calculer le montant de la taxe : ht fois tva, divise par 100
        # l'ajouter au prix hors taxes et ranger le resultat dans ttc
        # afficher ttc
      - |
        ttc = ht + ht * ___ / 100
        print(___)
      - |
        ttc = ht + ht * tva / 100
        print(___)
    solution: |
      ht = 50
      tva = 20
      ttc = ht + ht * tva / 100
      print(ttc)
    autres_solutions:
      - |
        ht = 50
        tva = 20
        ttc = ht * (1 + tva / 100)
        print(ttc)
    tests:
      - { variable: ttc, attendu: "60.0" }
      - { sortie: "60.0" }

  - id: dernier-caractere
    numero: 62
    titre: La dernière lettre
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Créer une variable `derniere` qui contient la dernière lettre de `mot`, sans écrire cette lettre directement et sans compter les lettres à la main : le programme doit fonctionner quelle que soit la longueur de `mot`. Puis afficher `derniere`.
    depart: |
      mot = "ordinateur"

    aides:
      - |
        # len(mot) donne le nombre de lettres
        # quel est l'indice de la derniere lettre, sachant que le premier indice est 0 ?
        # ranger cette lettre dans derniere, puis l'afficher
      - |
        derniere = mot[len(mot) - ___]
        print(___)
      - |
        derniere = mot[len(mot) - 1]
        print(___)
    solution: |
      mot = "ordinateur"
      derniere = mot[len(mot) - 1]
      print(derniere)
    autres_solutions:
      - |
        mot = "ordinateur"
        derniere = mot[-1]
        print(derniere)
    tests:
      - { variable: derniere, attendu: "'r'" }
      - { sortie: "r" }

  - id: predire-type-division
    numero: 63
    titre: Le type d'une division
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      x = 8 / 2
      print(type(x))
    choix: ["<class 'float'>", "<class 'int'>", "<class 'str'>", "Une erreur"]
    explication: |
      L'opérateur `/` donne toujours un flottant, même quand la division tombe juste : `x` vaut 4.0. Pour obtenir un entier, il faut utiliser `//`.

  - id: bug-moyenne-parentheses
    numero: 64
    titre: La moyenne trop grande
    notion: variables
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    tags: [maths]
    type: code
    enonce: |
      Ce programme doit calculer la moyenne de `a` et `b`, mais il affiche 17.0 au lieu de 12.0. Trouver l'erreur et la corriger.
    depart: |
      a = 10
      b = 14
      moyenne = a + b / 2
      print(moyenne)
    aides:
      - |
        # dans quel ordre Python effectue-t-il l'addition et la division ?
        # comment imposer de faire l'addition en premier ?
      - |
        a = 10
        b = 14
        moyenne = (___) / 2
        print(moyenne)
      - |
        a = 10
        b = 14
        moyenne = (a + b) / ___
        print(moyenne)
    solution: |
      a = 10
      b = 14
      moyenne = (a + b) / 2
      print(moyenne)
    tests:
      - { variable: moyenne, attendu: "12.0" }
      - { sortie: "12.0" }

  - id: predire-echange-rate
    numero: 65
    titre: L'échange raté
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = 1
      b = 2
      a = b
      b = a
      print(a, b)
    choix: ["2 2", "2 1", "1 2", "1 1"]
    explication: |
      À la ligne 3, `a` reçoit 2 et sa valeur 1 est perdue. À la ligne 4, `b` reçoit la valeur actuelle de `a`, c'est-à-dire 2. Pour échanger deux variables, il faut garder une copie dans une troisième variable.

  - id: rotation-trois
    numero: 66
    titre: Le tour de trois variables
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    type: code
    enonce: |
      Faire tourner les valeurs de trois variables : `a` doit recevoir la valeur de `b`, `b` celle de `c`, et `c` celle de `a`. Ne pas écrire les valeurs directement. Puis afficher `a`, `b` et `c` avec un seul `print`.

      Le programme affiche alors `2 3 1`.
    depart: |
      a = 1
      b = 2
      c = 3

    aides:
      - |
        # garder une copie de la valeur de a dans une nouvelle variable
        # donner a a la valeur de b, puis a b la valeur de c
        # donner a c la valeur gardee de cote
        # afficher les trois variables
      - |
        copie = ___
        a = b
        b = ___
        c = ___
        print(a, b, c)
      - |
        copie = a
        a = b
        b = c
        c = ___
        print(a, b, c)
    solution: |
      a = 1
      b = 2
      c = 3
      copie = a
      a = b
      b = c
      c = copie
      print(a, b, c)
    autres_solutions:
      - |
        a = 1
        b = 2
        c = 3
        a, b, c = b, c, a
        print(a, b, c)
    tests:
      - { variable: a, attendu: "2" }
      - { variable: b, attendu: "3" }
      - { variable: c, attendu: "1" }
      - { sortie: "2 3 1" }

  - id: chiffres-nombre
    numero: 67
    titre: Unités et dizaines
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Créer une variable `unites` qui contient le chiffre des unités de `n` et une variable `dizaines` qui contient son chiffre des dizaines, avec des calculs sur `n`. Puis les afficher avec un seul `print`.

      Pour `n = 2748`, le programme affiche `8 4`.
    depart: |
      n = 2748

    aides:
      - |
        # le reste de la division par 10 donne le chiffre des unites
        # la division entiere par 10 retire le chiffre des unites
        # on peut donc recommencer sur le resultat pour trouver les dizaines
      - |
        unites = n % ___
        dizaines = (n // ___) % ___
        print(unites, dizaines)
      - |
        unites = n % 10
        dizaines = (n // 10) % ___
        print(unites, dizaines)
    solution: |
      n = 2748
      unites = n % 10
      dizaines = (n // 10) % 10
      print(unites, dizaines)
    tests:
      - { variable: unites, attendu: "8" }
      - { variable: dizaines, attendu: "4" }
      - { sortie: "8 4" }

  - id: cadre-mot
    numero: 68
    titre: Le mot encadré
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    type: code
    enonce: |
      Afficher `mot` dans un cadre, avec trois `print`. La largeur du cadre doit s'adapter à la longueur de `mot`. Pour `"python"`, le programme affiche :

      ```
      +------+
      |python|
      +------+
      ```

      Conseil : `"-" * 3` donne `"---"`.
    depart: |
      mot = "python"

    aides:
      - |
        # construire la ligne du haut : un +, autant de - que de lettres, un +
        # afficher cette ligne, puis le mot entre deux |, puis de nouveau la ligne
      - |
        bord = "+" + "-" * ___ + "+"
        print(bord)
        print("|" + ___ + "|")
        print(bord)
      - |
        bord = "+" + "-" * len(mot) + "+"
        print(bord)
        print("|" + mot + "|")
        print(___)
    solution: |
      mot = "python"
      bord = "+" + "-" * len(mot) + "+"
      print(bord)
      print("|" + mot + "|")
      print(bord)
    tests:
      - { sortie: "+------+\n|python|\n+------+" }

  - id: heures-minutes-secondes
    numero: 69
    titre: Heures, minutes, secondes
    notion: variables
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    tags: [maths]
    type: code
    enonce: |
      Une durée vaut `total` secondes. Créer les variables `heures`, `minutes` et `secondes` qui donnent cette durée en heures, minutes et secondes, avec des calculs sur `total`. Puis les afficher avec un seul `print`.

      Pour 7384 secondes, le programme affiche `2 3 4`.
    depart: |
      total = 7384

    aides:
      - |
        # une heure dure 3600 secondes
        # le quotient par 3600 donne les heures, le reste est ce qu'il reste a repartir
        # faire la meme chose avec ce reste et 60
      - |
        heures = total // ___
        reste = total % ___
        minutes = reste // ___
        secondes = reste % ___
        print(heures, minutes, secondes)
      - |
        heures = total // 3600
        reste = total % 3600
        minutes = reste // 60
        secondes = ___
        print(heures, minutes, secondes)
    solution: |
      total = 7384
      heures = total // 3600
      reste = total % 3600
      minutes = reste // 60
      secondes = reste % 60
      print(heures, minutes, secondes)
    tests:
      - { variable: heures, attendu: "2" }
      - { variable: minutes, attendu: "3" }
      - { variable: secondes, attendu: "4" }
      - { sortie: "2 3 4" }

  - id: pots-peinture
    numero: 70
    titre: Les pots de peinture
    notion: variables
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    tags: [maths]
    type: code
    enonce: |
      Un mur mesure `longueur` mètres sur `hauteur` mètres, et un pot de peinture couvre `couverture` mètres carrés. Créer une variable `pots` qui contient le nombre de pots à acheter, puis l'afficher. On ne peut acheter que des pots entiers, et il faut assez de peinture pour tout le mur.

      Il faut y arriver sans `if`. Conseil : pour arrondir au-dessus une division entière par `couverture`, on peut ajouter `couverture - 1` avant de diviser.
    depart: |
      longueur = 7
      hauteur = 3
      couverture = 4

    aides:
      - |
        # calculer la surface du mur
        # une division entiere arrondit en dessous : 21 // 4 vaut 5, mais 5 pots ne suffisent pas
        # ajouter couverture - 1 a la surface avant de diviser permet d'arrondir au-dessus
      - |
        surface = longueur * hauteur
        pots = (surface + ___) // ___
        print(pots)
      - |
        surface = longueur * hauteur
        pots = (surface + couverture - 1) // ___
        print(pots)
    solution: |
      longueur = 7
      hauteur = 3
      couverture = 4
      surface = longueur * hauteur
      pots = (surface + couverture - 1) // couverture
      print(pots)
    autres_solutions:
      - |
        longueur = 7
        hauteur = 3
        couverture = 4
        pots = -(-longueur * hauteur // couverture)
        print(pots)
    tests:
      - { variable: pots, attendu: "6" }
      - { sortie: "6" }
