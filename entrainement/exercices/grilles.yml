  - id: bug-diagonale
    numero: 59
    titre: La somme de la diagonale
    notion: grilles
    niveaux: [premiere]
    difficulte: 2
    duree: 3
    tags: [maths]
    type: code
    enonce: |
      Cette fonction doit renvoyer la somme de la diagonale d'une grille carrée, c'est-à-dire des cases dont l'indice de ligne est égal à l'indice de colonne. Elle contient une erreur : `somme_diagonale([[1, 2], [3, 4]])` renvoie 4 au lieu de 5. La corriger.
    depart: |
      def somme_diagonale(grille):
          total = 0
          for i in range(len(grille)):
              total = total + grille[i][0]
          return total
    aides:
      - |
        # quelles cases cette boucle additionne-t-elle ?
        # pour une case de la diagonale, que vaut l'indice de colonne ?
      - |
        def somme_diagonale(grille):
            total = 0
            for i in range(len(grille)):
                total = total + grille[i][___]
            return total
      - |
        def somme_diagonale(grille):
            total = 0
            for i in range(len(grille)):
                total = total + grille[i][i]
            return ___
    solution: |
      def somme_diagonale(grille):
          total = 0
          for i in range(len(grille)):
              total = total + grille[i][i]
          return total
    tests:
      - { appel: "somme_diagonale([[1, 2], [3, 4]])", attendu: "5" }
      - { appel: "somme_diagonale([[7]])", attendu: "7" }
      - { appel: "somme_diagonale([[1, 0, 0], [0, 2, 0], [0, 0, 3]])", attendu: "6" }
      - { appel: "somme_diagonale([[2, 9, 9], [9, 2, 9], [9, 9, 2]])", attendu: "6", cache: true }

