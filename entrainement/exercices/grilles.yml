    aides:
      - |
        def somme_de(ligne):
            # commencer par ecrire une fonction qui renvoie la somme d'une ligne

        def lignes_egales(grille):
            # calculer la somme de la premiere ligne, c'est la reference
            # parcourir les lignes
            #     si la somme d'une ligne differe de la reference, renvoyer False
            # apres la boucle, renvoyer True
      - |
        def somme_de(ligne):
            total = 0
            for valeur in ligne:
                total = ___
            return total

        def lignes_egales(grille):
            reference = somme_de(grille[___])
            for ligne in grille:
                if somme_de(___) != reference:
                    return ___
            return ___
      - |
        def somme_de(ligne):
            total = 0
            for valeur in ligne:
                total = total + valeur
            return total

        def lignes_egales(grille):
            reference = somme_de(grille[0])
            for ligne in grille:
                if somme_de(ligne) != reference:
                    return False
            return ___
    solution: |
      def somme_de(ligne):
          total = 0
          for valeur in ligne:
              total = total + valeur
          return total

      def lignes_egales(grille):
          reference = somme_de(grille[0])
          for ligne in grille:
              if somme_de(ligne) != reference:
                  return False
          return True
    tests:
      - { appel: "lignes_egales([[2, 7, 6], [9, 5, 1], [4, 3, 8]])", attendu: "True" }
      - { appel: "lignes_egales([[1, 2], [3, 4]])", attendu: "False" }
      - { appel: "lignes_egales([[5]])", attendu: "True", libelle: "lignes_egales([[5]]) : une seule ligne" }
      - { appel: "lignes_egales([[1, 1], [2, 0], [1, 2]])", attendu: "False", libelle: "lignes_egales([[1, 1], [2, 0], [1, 2]]) : seule la dernière diffère" }
      - { appel: "lignes_egales([[3, 3], [6, 0], [0, 6]])", attendu: "True", cache: true }
