    type: code
    enonce: |
      Compléter la fonction `creer_grille(n, m, valeur)` pour qu'elle renvoie une grille de `n` lignes et `m` colonnes, remplie de `valeur`. Attention, chaque ligne doit être une liste bien distincte des autres.
