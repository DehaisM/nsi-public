        def somme_ligne(grille, i):
            # creer une variable total qui vaut 0
            # parcourir les elements de la ligne d'indice i
            #     ajouter l'element a total
            # renvoyer total
      - |
        def somme_ligne(grille, i):
            total = 0
            for valeur in grille[___]:
