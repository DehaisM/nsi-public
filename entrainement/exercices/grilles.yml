  - id: colonne-grille
    numero: 14
    titre: Une colonne de la grille
    notion: grilles
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Écrire une fonction `colonne(grille, j)` qui renvoie la liste des éléments de la colonne `j` de `grille`.

      Par exemple, avec `G = [[1, 2], [3, 4], [5, 6]]`, l'appel `colonne(G, 1)` renvoie `[2, 4, 6]`.
    depart: |
      def colonne(grille, j):
          ...
    aides:
      - |
        def colonne(grille, j):
            # creer une liste vide
            # parcourir chaque ligne de la grille
            #     ajouter a la liste l'element d'indice j de cette ligne
            # renvoyer la liste
      - |
        def colonne(grille, j):
            resultat = []
            for ligne in grille:
                resultat.append(ligne[___])
            return ___
      - |
        def colonne(grille, j):
            resultat = []
            for ligne in grille:
                resultat.append(ligne[j])
            return ___
    solution: |
      def colonne(grille, j):
          resultat = []
          for ligne in grille:
              resultat.append(ligne[j])
          return resultat
    tests:
      - { appel: "colonne([[1, 2], [3, 4], [5, 6]], 1)", attendu: "[2, 4, 6]" }
      - { appel: "colonne([[1, 2], [3, 4], [5, 6]], 0)", attendu: "[1, 3, 5]" }
      - { appel: "colonne([[7, 8, 9]], 2)", attendu: "[9]", cache: true }

  - id: compter-bateaux
    numero: 15
    titre: Bataille navale
    notion: grilles
    niveaux: [premiere]
    difficulte: 3
    duree: 5
    type: code
    enonce: |
      Une grille de bataille navale contient `"B"` pour une case de bateau et `"."` pour une case d'eau.

      Écrire une fonction `compter(grille, symbole)` qui renvoie le nombre de cases de `grille` qui contiennent `symbole`, avec deux boucles imbriquées.
    depart: |
      def compter(grille, symbole):
          ...
    aides:
      - |
        def compter(grille, symbole):
            # creer un compteur qui vaut 0
            # parcourir chaque ligne de la grille
            #     parcourir chaque case de cette ligne
            #         si la case contient symbole, ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def compter(grille, symbole):
            total = 0
            for ligne in ___:
                for case in ___:
                    if case == ___:
                        total = total + 1
            return total
      - |
        def compter(grille, symbole):
            total = 0
            for ligne in grille:
                for case in ligne:
                    if case == ___:
                        total = total + 1
            return total
    solution: |
      def compter(grille, symbole):
          total = 0
          for ligne in grille:
              for case in ligne:
                  if case == symbole:
                      total = total + 1
          return total
    interdit: [count]
    tests:
      - { appel: "compter([['B', '.'], ['.', 'B']], 'B')", attendu: "2" }
      - { appel: "compter([['B', '.'], ['.', 'B']], '.')", attendu: "2" }
      - { appel: "compter([['.', '.']], 'B')", attendu: "0" }
      - { appel: "compter([['B', 'B', 'B'], ['B', '.', '.']], 'B')", attendu: "4", cache: true }

