    aides:
      - |
        # la boucle sur i construit les lignes, il y en a n
        # la boucle sur j remplit une ligne, elle a m cases
      - |
        def creer_grille(n, m, valeur):
            grille = []
            for i in range(n):
                ligne = []
                for j in range(___):
                    ligne.append(___)
                grille.append(___)
            return grille
      - |
        def creer_grille(n, m, valeur):
            grille = []
            for i in range(n):
                ligne = []
