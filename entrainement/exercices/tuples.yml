  - id: dans-le-carre
    numero: 217
    titre: Les points dans le carré
    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `dans_le_carre(points, c)` qui reçoit un tuple de points `(x, y)` et renvoie combien d'entre eux sont dans le carré allant de 0 à `c` sur les deux axes, bords compris.
    depart: |
      def dans_le_carre(points, c):
          ...
    aides:
      - |
        def dans_le_carre(points, c):
            # creer un compteur qui vaut 0
            # parcourir les points, en les depaquetant en x et y
            #     si x et y sont tous les deux entre 0 et c, ajouter 1 au compteur
            # renvoyer le compteur
      - |
        def dans_le_carre(points, c):
            compteur = 0
            for x, y in points:
                if 0 <= x <= ___ and ___ <= y <= ___:
                    compteur = compteur + 1
            return compteur
      - |
        def dans_le_carre(points, c):
            compteur = 0
            for x, y in points:
                if 0 <= x <= c and 0 <= y <= c:
                    compteur = ___
            return compteur
    solution: |
      def dans_le_carre(points, c):
          compteur = 0
          for x, y in points:
              if 0 <= x <= c and 0 <= y <= c:
                  compteur = compteur + 1
          return compteur
    autres_solutions:
      - |
        def dans_le_carre(points, c):
            compteur = 0
            for p in points:
                if p[0] >= 0 and p[0] <= c and p[1] >= 0 and p[1] <= c:
                    compteur = compteur + 1
            return compteur
    tests:
      - { appel: "dans_le_carre(((1, 1), (5, 2), (2, 9)), 4)", attendu: "1" }
      - { appel: "dans_le_carre(((0, 0), (4, 4)), 4)", attendu: "2", libelle: "dans_le_carre(((0, 0), (4, 4)), 4) : les bords comptent" }
      - { appel: "dans_le_carre(((-1, 2), (2, -1)), 4)", attendu: "0", libelle: "dans_le_carre(((-1, 2), (2, -1)), 4) : des coordonnées négatives" }
