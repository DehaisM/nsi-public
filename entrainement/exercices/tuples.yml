    interdit: [min, max, sorted, sort]
    aides:
      - |
        # commencer par depaqueter le couple dans a et b
        # s'ils sont deja dans l'ordre, renvoyer le couple tel quel
        # sinon, renvoyer les deux nombres dans l'autre sens
      - |
        def ordonner(couple):
            a, b = couple
            if a <= b:
                return ___, ___
