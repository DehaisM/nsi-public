  - id: arrivee-deplacements
    numero: 218
    titre: Le point d'arrivée
    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    type: code
    enonce: |
      Un robot part du point `depart`, puis il enchaîne des déplacements. Chaque déplacement est un tuple `(dx, dy)`, et ils sont tous réunis dans un tuple `deplacements`.

      Écrire une fonction `arrivee(depart, deplacements)` qui renvoie le point d'arrivée. Par exemple, `arrivee((0, 0), ((2, 1), (-1, 3)))` renvoie `(1, 4)`.
    depart: |
      def arrivee(depart, deplacements):
          ...
    aides:
      - |
        def arrivee(depart, deplacements):
            # depaqueter le point de depart dans x et y
            # parcourir les deplacements, en les depaquetant en dx et dy
            #     ajouter dx a x et dy a y
            # renvoyer le tuple (x, y)
      - |
        def arrivee(depart, deplacements):
            x, y = ___
            for dx, dy in ___:
                x = ___
                y = ___
            return x, y
      - |
        def arrivee(depart, deplacements):
            x, y = depart
            for dx, dy in deplacements:
                x = x + dx
                y = ___
            return x, y
    solution: |
