    duree: 2
    type: code
    enonce: |
      Le score d'un match est un tuple `(buts_a, buts_b)` : les buts de l'équipe A, puis ceux de l'équipe B.

      Écrire une fonction `resultat(score)` qui renvoie `"A"` si l'équipe A a gagné, `"B"` si l'équipe B a gagné, et `"nul"` en cas d'égalité.
    depart: |
