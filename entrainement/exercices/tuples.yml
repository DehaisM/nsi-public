      def pgcd(a, b):
          while b != 0:
              a, b = b, a % b
          return a

      def somme(f1, f2):
          a, b = f1
          c, d = f2
          num = a * d + c * b
          den = b * d
          g = pgcd(num, den)
          return num // g, den // g
