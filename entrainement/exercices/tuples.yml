            # sinon, si les mois sont differents, le plus petit mois l'emporte
            # sinon, comparer les jours
      - |
        def plus_tot(d1, d2):
            j1, m1, a1 = d1
            j2, m2, a2 = d2
            if a1 != a2:
                if a1 < a2:
                    return d1
                return ___
            if m1 != m2:
                if m1 < m2:
                    return ___
                return ___
            if j1 <= j2:
                return ___
            return ___
      - |
        def plus_tot(d1, d2):
            j1, m1, a1 = d1
            j2, m2, a2 = d2
            if a1 != a2:
                if a1 < a2:
                    return d1
                return d2
            if m1 != m2:
                if m1 < m2:
                    return d1
                return d2
            if j1 <= j2:
                return ___
            return ___
    solution: |
      def plus_tot(d1, d2):
          j1, m1, a1 = d1
          j2, m2, a2 = d2
          if a1 != a2:
              if a1 < a2:
                  return d1
              return d2
          if m1 != m2:
              if m1 < m2:
