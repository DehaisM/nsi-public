    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 4
    tags: [maths]
    type: code
    enonce: |
      Écrire une fonction `bilan(notes)` qui reçoit un tuple de notes non vide et renvoie le tuple `(nombre, moyenne)` : le nombre de notes, puis leur moyenne, sans utiliser `sum`.
    depart: |
      def bilan(notes):
          ...
    interdit: [sum]
    aides:
      - |
        def bilan(notes):
            # additionner les notes avec une boucle
            # compter les notes avec len
            # renvoyer les deux valeurs, separees par une virgule
      - |
        def bilan(notes):
            total = 0
            for n in notes:
                total = ___
            nombre = len(___)
            return nombre, ___
      - |
