  - id: bug-translation
    numero: 214
    titre: Le point qui ne bouge pas
    notion: tuples
    niveaux: [premiere]
    difficulte: 1
    duree: 3
    type: code
    enonce: |
      Cette fonction doit renvoyer le point `p` déplacé de `dx` horizontalement et de `dy` verticalement. Par exemple, `translation((1, 2), 3, -1)` doit renvoyer `(4, 1)`. Elle provoque une erreur : la lire, puis corriger la fonction.
    depart: |
      def translation(p, dx, dy):
          p[0] = p[0] + dx
          p[1] = p[1] + dy
          return p
    aides:
      - |
        # quel type d'erreur s'affiche ?
        # peut-on modifier un element d'un tuple ?
        # que faut-il faire a la place ?
      - |
        def translation(p, dx, dy):
            return (p[0] + ___, p[1] + ___)
      - |
        def translation(p, dx, dy):
            x, y = p
            return (x + dx, ___)
    solution: |
      def translation(p, dx, dy):
          return (p[0] + dx, p[1] + dy)
    autres_solutions:
      - |
        def translation(p, dx, dy):
            x, y = p
            return x + dx, y + dy
    tests:
      - { appel: "translation((1, 2), 3, -1)", attendu: "(4, 1)" }
      - { appel: "translation((0, 0), 0, 0)", attendu: "(0, 0)" }
      - { appel: "translation((-2, 5), 2, -5)", attendu: "(0, 0)", cache: true }

