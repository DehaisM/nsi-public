exercices:

  - id: predire-tranche-tuple
    numero: 205
    titre: Indices et tranches d'un tuple
    notion: tuples
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      t = ("a", "b", "c", "d")
      print(t[-2], t[1:3])
    choix: ["c ('b', 'c')", "c ('b', 'c', 'd')", "b ('a', 'b')", "d ('b', 'c')"]
    explication: |
      `t[-2]` est l'avant-dernier élément, `"c"`. Comme pour une liste, la tranche `t[1:3]` prend les indices 1 et 2, et elle donne un nouveau **tuple**.

  - id: predire-virgule
    numero: 206
    titre: La virgule qui change tout
    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a = (3)
      b = (3,)
      print(a * 2, b * 2)
    choix: ["6 (3, 3)", "6 6", "(3, 3) (3, 3)", "(6,) (6,)"]
    explication: |
      Sans virgule, `(3)` n'est que l'entier 3 entre parenthèses : `a * 2` vaut 6. Avec la virgule, `(3,)` est un tuple, et multiplier un tuple par 2 le répète : `(3, 3)`.

  - id: predire-depaquetage-fibonacci
    numero: 207
    titre: Deux affectations à la fois
    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 2
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      a, b = 1, 2
      a, b = b, a + b
      print(a, b)
    choix: ["2 3", "2 4", "3 2", "1 2"]
    explication: |
      À droite du `=`, le tuple `(b, a + b)` est calculé **en entier** avec les anciennes valeurs, soit `(2, 3)`, avant d'être dépaqueté dans `a` et `b`.

  - id: predire-nouveau-tuple
    numero: 208
    titre: Un nouveau tuple
    notion: tuples
    niveaux: [premiere]
    difficulte: 2
    duree: 2
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      t = (1, 2)
      u = t
      t = t + (3,)
      print(u)
    choix: ["(1, 2)", "(1, 2, 3)", "(3,)", "[1, 2, 3]"]
    explication: |
      Un tuple ne se modifie pas : `t + (3,)` construit un **nouveau** tuple, et seul `t` désigne ce nouveau tuple. `u` désigne toujours l'ancien, `(1, 2)`.

  - id: predire-tuple-de-points
    numero: 209
    titre: Un tuple de points
    notion: tuples
    niveaux: [premiere]
    difficulte: 1
    duree: 1
    type: prediction
    enonce: Qu'affiche ce programme ?
    code: |
      points = ((1, 2), (3, 4), (5, 6))
      print(points[1][0])
    choix: ["3", "2", "4", "(3, 4)"]
    explication: |
      `points[1]` est le deuxième point, `(3, 4)`. Son élément d'indice 0 est 3.

  - id: extremites
    numero: 210
    titre: Le premier et le dernier
    notion: tuples
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    type: code
    enonce: |
      Écrire une fonction `extremites(valeurs)` qui reçoit un tuple non vide et renvoie le tuple formé de son premier et de son dernier élément. Par exemple, `extremites((4, 7, 9))` renvoie `(4, 9)`.
    depart: |
      def extremites(valeurs):
          ...
    aides:
      - |
        def extremites(valeurs):
            # recuperer le premier element, d'indice 0
            # recuperer le dernier element, avec un indice negatif
            # renvoyer les deux, separes par une virgule
      - |
        def extremites(valeurs):
            return valeurs[___], valeurs[___]
      - |
        def extremites(valeurs):
            return valeurs[0], valeurs[___]
    solution: |
      def extremites(valeurs):
          return valeurs[0], valeurs[-1]
    autres_solutions:
      - |
        def extremites(valeurs):
            return (valeurs[0], valeurs[len(valeurs) - 1])
    tests:
      - { appel: "extremites((4, 7, 9))", attendu: "(4, 9)" }
      - { appel: "extremites((5,))", attendu: "(5, 5)", libelle: "extremites((5,)) : un seul élément" }
      - { appel: "extremites(('a', 'b'))", attendu: "('a', 'b')" }
      - { appel: "extremites((1, 2, 3, 4, 5))", attendu: "(1, 5)", cache: true }

  - id: symetrique
    numero: 211
    titre: Le point symétrique
    notion: tuples
    niveaux: [premiere]
    difficulte: 1
    duree: 2
    tags: [maths]
    type: code
    enonce: |
      Le symétrique du point `(x, y)` par rapport à la diagonale du repère est le point `(y, x)`.

      Écrire une fonction `symetrique(point)` qui reçoit un point sous forme de tuple et renvoie son symétrique, lui aussi sous forme de tuple.
    depart: |
      def symetrique(point):
          ...
    aides:
      - |
        def symetrique(point):
            # depaqueter point dans deux variables x et y
            # renvoyer le tuple forme de y puis de x
      - |
        def symetrique(point):
            x, y = ___
            return ___, ___
      - |
        def symetrique(point):
            x, y = point
            return ___
    solution: |
      def symetrique(point):
          x, y = point
          return y, x
    autres_solutions:
